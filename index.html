<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#F7F8FA">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="msapplication-tap-highlight" content="no">
<title>ReShop India — Buy &amp; Sell Pre-Loved Goods</title>
<meta name="description" content="ReShop India — apna khud ka bazaar. Buy and sell used goods across India.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
/* ============================= */
/* 1. DESIGN TOKENS               */
/* ============================= */
:root{
  /* WhatsApp's own palette — signature teal/green #008069 & #00A884,
     bright WhatsApp green #25D366 for CTAs/badges, near-white app
     background, near-black text, and WhatsApp's soft gray divider.
     Everything else in the file (layout, spacing, components) is
     untouched — only these token values changed, so the recolor applies
     everywhere automatically. */
  --blue-600:#008069;
  --blue-500:#00A884;
  --blue-50:#E7F8F3;
  --green-600:#25D366;
  --green-700:#1DA851;
  --bg:#F7F8FA;
  --card:#FFFFFF;
  --ink:#111B21;
  --ink-soft:#667781;
  --ink-faint:#8696A0;
  --line:#E9EDEF;
  --radius-lg:16px;
  --radius-md:12px;
  --radius-sm:8px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.08);
  --shadow-md:0 8px 24px rgba(15,23,42,.10);
  --shadow-lg:0 20px 48px rgba(15,23,42,.18);
  --header-h:120px;
  --nav-h:68px;
  --search-header-h:62px;
  --kb-inset:0px;
  --font:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
}
/* WhatsApp's own dark mode palette (#0B141A background, #202C33 cards,
   #00A884 accent teal/green) — same idea as above, dark theme only. */
[data-theme="dark"]{
  --blue-600:#00A884;
  --blue-500:#00A884;
  --blue-50:#0B3D33;
  --green-600:#25D366;
  --green-700:#1DA851;
  --bg:#0B141A;
  --card:#202C33;
  --ink:#E9EDEF;
  --ink-soft:#8696A0;
  --ink-faint:#667781;
  --line:#2A3942;
  --shadow-sm:0 1px 2px rgba(0,0,0,.45);
  --shadow-md:0 8px 24px rgba(0,0,0,.55);
  --shadow-lg:0 20px 48px rgba(0,0,0,.7);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html, body {
  -webkit-text-size-adjust: 100% !important;
  -moz-text-size-adjust: 100% !important;
  -ms-text-size-adjust: 100% !important;
  text-size-adjust: 100% !important;
  touch-action: manipulation;
  }
/* ---------------------------------------------------------
   STRICT NATIVE APP LOCK: no browser-driven text resizing,
   no pull-to-refresh / overscroll bounce, no long-press image
   or text context menus / callouts, no accidental text
   selection anywhere except inside actual form fields.
   --------------------------------------------------------- */
/* ---------------------------------------------------------
   RIGID 3-LAYER NATIVE-APP SANDBOX (fixes header/nav drag +
   overscroll bounce + refresh-like flicker):
   html/body are pinned to the screen and can NEVER scroll or
   rubber-band themselves. #appHeader and #bottomNav are
   position:fixed + flex-shrink:0 so they are permanently
   pinned to the viewport edges. The ONLY element allowed to
   scroll is whichever `.view-panel` is currently visible
   (#mainContent / #profileView / #detailView) — see the
   MAIN/FEED section below for that class.
   --------------------------------------------------------- */
html{
  /* Locks the root font-size to a fixed 16px so every `rem` value in
     this file resolves to the exact same pixel size on every browser —
     without this, a browser's own "Font size" / accessibility text-
     scaling setting (which differs from browser to browser, and is
     often different from one app's in-app WebView vs a full browser
     like Chrome) silently multiplies every rem-based button, card and
     text size, making the whole layout look bigger or smaller depending
     purely on which browser happened to open it. */
  font-size:16px;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  overscroll-behavior:none;
  touch-action:pan-y;
  height:100%;
  height:100dvh;
  overflow:hidden;
  position:fixed;
  top:0; left:0;
  width:100%;
}
body{
  overscroll-behavior:none;
  touch-action:pan-y;
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
  height:100%;
  height:100dvh;
  overflow:hidden;
  position:fixed;
  top:0; left:0;
  width:100%;
}
img, svg{
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-user-drag:none;
}
input, textarea, select{
  -webkit-user-select:text;
  user-select:text;
  -webkit-touch-callout:default;
}
/* Belt-and-braces against mobile browsers (Chrome/Brave "force dark") that
   try to auto-invert page colors: explicitly re-assert the light palette
   whenever data-theme="light" is set, regardless of the OS/browser theme. */
html[data-theme="light"], html[data-theme="light"] body{
  background-color:var(--bg) !important;
  color:var(--ink) !important;
  color-scheme:light !important;
}
/* Disables all transitions for the single frame a theme switch happens on,
   so hundreds of themed elements don't each animate their own color change
   in a staggered, laggy-looking cascade — applyTheme() toggles this. */
.theme-switching, .theme-switching *{ transition:none !important; }
html,body{margin:0;padding:0;}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  transition:background .3s ease, color .3s ease;
}
button{font-family:inherit; cursor:pointer;}
img{max-width:100%; display:block;}
a{color:inherit; text-decoration:none;}
::selection{background:var(--blue-600); color:#fff;}
.hidden{display:none !important;}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}

/* Scrollbar */
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--ink-faint); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ============================= */
/* 2. SPLASH SCREEN               */
/* ============================= */
#splash{
  position:fixed; inset:0; z-index:9999;
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  background:radial-gradient(circle at 30% 20%, #25D366 0%, #008069 45%, #003D33 100%);
  transition:opacity .6s ease, transform .6s ease;
}
#splash.exit{opacity:0; transform:scale(1.15); pointer-events:none;}
.splash-bag{
  width:88px; height:88px;
  animation:dropBag 1s cubic-bezier(.34,1.56,.64,1) both;
  filter:drop-shadow(0 12px 22px rgba(0,0,0,.35));
}
@keyframes dropBag{
  0%{transform:translateY(-160px) rotate(-18deg) scale(.6); opacity:0;}
  60%{transform:translateY(10px) rotate(6deg) scale(1.06); opacity:1;}
  80%{transform:translateY(-6px) rotate(-2deg) scale(.99);}
  100%{transform:translateY(0) rotate(0deg) scale(1);}
}
.splash-title{
  margin-top:22px; font-size:2.4rem; font-weight:800; color:#fff; letter-spacing:.5px;
  animation:glow 1.8s ease-in-out .5s infinite alternate;
}
@keyframes glow{
  from{text-shadow:0 0 8px rgba(255,255,255,.35), 0 0 18px rgba(37,211,102,.4);}
  to{text-shadow:0 0 20px rgba(255,255,255,.85), 0 0 42px rgba(37,211,102,.85);}
}
.splash-badge{
  margin-top:14px; padding:8px 18px; border-radius:999px;
  background:rgba(255,255,255,.14); backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.28);
  color:#e0e7ff; font-weight:600; font-size:.95rem;
  opacity:0; animation:fadeUp .8s ease 1.1s forwards;
}
@keyframes fadeUp{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);}}
.splash-loader{
  margin-top:34px; width:140px; height:4px; border-radius:4px; background:rgba(255,255,255,.2); overflow:hidden;
}
.splash-loader::after{
  content:""; display:block; height:100%; width:40%; border-radius:4px;
  background:#fff; animation:loaderMove 1.4s ease-in-out infinite;
}
@keyframes loaderMove{
  0%{transform:translateX(-100%);} 100%{transform:translateX(350%);}
}

/* ============================= */
/* 3. HEADER                      */
/* ============================= */
header#appHeader{
  position:fixed; top:0; left:0; right:0; z-index:500;
  flex-shrink:0;
  background:var(--bg);
  border-bottom:1px solid var(--line);
  box-shadow:none;
}
.header-top{
  display:flex; align-items:center; gap:12px;
  padding:14px 16px 10px;
}
.icon-btn{
  width:40px; height:40px; border-radius:var(--radius-sm);
  display:flex; align-items:center; justify-content:center;
  background:var(--bg); border:1px solid var(--line); color:var(--ink);
  flex-shrink:0; transition:background .15s ease, transform .1s ease;
}
.icon-btn:active{transform:scale(.93);}
.theme-toggle-btn{ color:var(--blue-600); position:relative; overflow:hidden; }
.theme-icon{ transition:opacity .2s ease; }
@keyframes themeIconPop{
  from{ transform:scale(.4) rotate(-100deg); opacity:0; }
  to{ transform:scale(1) rotate(0deg); opacity:1; }
}
.theme-icon.pop{ animation:themeIconPop .38s cubic-bezier(.34,1.56,.64,1); }
.header-title{
  flex:1; text-align:center; font-size:1.55rem; font-weight:800; color:var(--ink);
  letter-spacing:.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.header-brand{ font-weight:800; letter-spacing:0px; }
.header-brand-accent2{ color:var(--blue-600); }
.header-title-accent{ font-weight:600; opacity:.85; font-size:.92em; color:var(--ink-soft); }
.header-actions{display:flex; gap:8px; align-items:center;}

/* ---------------------------------------------------------
   HEADER "HERO" — dark gradient banner (menu / title / search
   icon + the big pill search bar) capped with rounded bottom
   corners. Sits INSIDE #appHeader, above the category pills
   row, which keeps its own plain --card background untouched
   below it.
   --------------------------------------------------------- */
.header-hero{
  position:relative;
  background:var(--bg);
  padding-bottom:0;
  overflow:hidden;
}
.header-hero .header-top{ padding:16px 16px 14px; }
.header-hero .icon-btn{
  background:transparent;
  border:none;
  color:var(--ink-soft);
  box-shadow:none;
}
.header-hero .icon-btn:active{ background:var(--line); border-radius:50%; }
/* Search icon in the header corner: bare icon, no button chrome. */
#searchOpenBtn{
  background:transparent !important;
  border:none !important;
  box-shadow:none !important;
}
#searchOpenBtn:active{ background:transparent !important; }
.header-hero .header-title{
  color:var(--ink);
  letter-spacing:.3px;
}
.header-hero .header-title-accent{
  color:var(--ink-soft);
  opacity:.85;
}
.header-searchbar{
  margin:0 16px 0; display:flex; align-items:center; gap:10px;
  background:var(--line);
  border:none;
  border-radius:10px;
  padding:9px 8px 9px 14px;
  box-shadow:none;
}
[data-theme="dark"] .header-searchbar{ background:var(--card); }
/* Purely a decorative "what are you looking for" text plate — never
   clickable, never intercepts taps (only the mic button next to it is
   interactive). A small search-glass icon is drawn before it via
   ::before so it reads as a proper search field, matching a
   WhatsApp-style search bar, without altering any markup/JS. */
.header-searchbar-text{
  flex:1; color:var(--ink-soft); font-size:.87rem; font-weight:500;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  pointer-events:none;
  display:flex; align-items:center; gap:10px;
}
.header-searchbar-text::before{
  content:"";
  flex-shrink:0;
  width:17px; height:17px;
  background-color:var(--ink-faint);
  -webkit-mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="black" stroke-width="2"/><path d="M21 21L16.65 16.65" stroke="black" stroke-width="2" stroke-linecap="round"/></svg>') center/contain no-repeat;
  mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="black" stroke-width="2"/><path d="M21 21L16.65 16.65" stroke="black" stroke-width="2" stroke-linecap="round"/></svg>') center/contain no-repeat;
}
.header-searchbar-mic{
  width:32px; height:32px; border-radius:50%; flex-shrink:0;
  background:transparent; border:none;
  display:flex; align-items:center; justify-content:center; color:var(--blue-600);
  box-shadow:none;
  cursor:pointer; padding:0;
  transition:transform .1s ease, background .15s ease, border-color .15s ease;
}
.header-searchbar-mic:active{ transform:scale(.9); }
/* Shown while actively listening for speech — mirrors native Android's
   own mic-recording indicator: the mic itself just blinks (shows, hides,
   shows, hides...) at a steady rhythm, no color change on the button. */
.header-searchbar-mic.listening{
  animation:micBlink 1s steps(1, end) infinite;
}
@keyframes micBlink{
  0%, 49%{ opacity:1; }
  50%, 100%{ opacity:0; }
}
/* Voice-search status shown in place of the decorative search-bar text
   (YouTube-style): a pulsing red dot + "Listening..." while the mic is
   recording, then a small spinner + "Searching..." once speech has been
   captured and a result is being handled — swaps back to the normal
   placeholder text automatically once done. Text content itself is
   swapped in JS; only the dot/spinner indicator and color are CSS-driven
   via these two state classes on #headerSearchBar. */
.header-searchbar-text{ display:flex; align-items:center; }
.header-searchbar.voice-listening .header-searchbar-text,
.header-searchbar.voice-searching .header-searchbar-text{
  color:var(--blue-600); font-weight:700; pointer-events:none;
}
.header-searchbar.voice-listening .header-searchbar-text::after,
.header-searchbar.voice-searching .header-searchbar-text::after{
  content:""; flex-shrink:0; margin-left:8px; display:inline-block;
}
.header-searchbar.voice-listening .header-searchbar-text::after{
  width:8px; height:8px; border-radius:50%; background:#ef4444;
  animation:voiceDotPulse 1s ease-in-out infinite;
}
.header-searchbar.voice-searching .header-searchbar-text::after{
  width:13px; height:13px; border-radius:50%; background:transparent;
  border:2px solid var(--line); border-top-color:var(--blue-600);
  animation:spin .7s linear infinite;
}
@keyframes voiceDotPulse{
  0%,100%{ opacity:.35; transform:scale(.75); }
  50%{ opacity:1; transform:scale(1.15); }
}
.search-wrap{
  position:relative; padding:0 16px; margin-bottom:10px;
}
.search-input{
  width:100%; padding:11px 40px 11px 40px; border-radius:var(--radius-md);
  border:1.5px solid var(--line); background:var(--bg); color:var(--ink);
  font-size:.92rem; font-family:inherit; outline:none;
  transition:border-color .15s ease, box-shadow .15s ease;
}
.search-input:focus{border-color:var(--blue-500); box-shadow:0 0 0 4px var(--blue-50);}
.search-icon{
  position:absolute; left:28px; top:50%; transform:translateY(-50%);
  color:var(--ink-faint); pointer-events:none;
}
/* Shared position/shape for the right-side action button — only one of
   #searchBackBtn / #searchClear is ever visible at a time, toggled in JS
   based on focus + whether there's any text, so they occupy the exact
   same spot and the input's reserved padding never needs to change. */
.search-action-btn{
  position:absolute; top:50%; right:26px; transform:translateY(-50%);
  width:24px; height:24px; margin:0; padding:0; border-radius:50%; border:none;
  background:var(--line); color:var(--ink-soft); font-size:.72rem; line-height:1;
  display:flex; align-items:center; justify-content:center;
  box-sizing:border-box; cursor:pointer;
}
/* Filter button — same bare, no-background treatment as the search icon
   right next to it (per feedback: a background pill here — even just
   for the open/dropdown state — visually "floats" against the plain
   icons beside it). height is still pinned to the icons' own 40px so
   its center lines up with theirs pixel-for-pixel; only its ICON+TEXT
   COLOR changes — to the same green as the mic/Sell button — the moment
   a specific category (not "All") is the active filter, so the button
   still signals "a filter is on" without ever growing a background. */
.filter-btn{
  display:flex; align-items:center; justify-content:center; gap:6px; flex-shrink:0;
  height:40px; box-sizing:border-box; padding:0 10px; border-radius:999px;
  background:transparent; border:none; color:var(--ink-soft);
  font-size:.78rem; font-weight:700; font-family:inherit;
  cursor:pointer; transition:background .15s ease, color .15s ease;
}
.filter-btn:active{ background:var(--line); }
.filter-btn svg{ flex-shrink:0; }
.filter-btn.category-active{ color:var(--green-600); }
/* Longer category names (e.g. "Electric", "Mobiles") were widening this
   button, which shrank the app title next to it via its flex:1 —
   capping the label's own width (with its own ellipsis) keeps the
   button's width — and therefore the title's available space — roughly
   constant no matter which category is showing. */
#filterBtnLabel{
  max-width:62px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
/* Dropdown panel — a plain VERTICAL list (one category per row, full
   width, stacked top-to-bottom like the product feed itself) rather
   than a horizontal scrolling strip, opened/closed by the Filter button
   above. Sits right under the header, in normal document flow. */
.category-dropdown{
  display:flex; flex-direction:column;
  background:var(--card);
  border-top:1px solid var(--line);
}
.category-option{
  display:block; width:100%; text-align:left;
  padding:13px 18px; border:none; border-bottom:1px solid var(--line);
  background:var(--card); color:var(--ink); font-size:.9rem; font-weight:600;
  font-family:inherit; cursor:pointer; transition:background .15s ease, color .15s ease;
}
.category-option:last-child{ border-bottom:none; }
.category-option.active{
  background:rgba(37,211,102,.14); color:var(--green-700); font-weight:800;
}
.category-option:active{ background:var(--line); }

.nearby-banner-wrap {
  position: sticky;
  left: 0;
  z-index: 50;
  display: flex;
  align-items: stretch;
  align-self: stretch;
  flex-shrink: 0;
  background: var(--card);
  margin-left: 0 !important;
  padding-left: 0 !important;
  padding-right: 10px;
  box-shadow: 8px 0 12px -4px rgba(0,0,0,.10);
}

.nearby-banner {
  display: flex;
  align-items: center;
  height: 100%;
  box-sizing: border-box;
  gap: 5px;
  flex-shrink: 0;
  padding: 8px 16px;
  background: var(--blue-50);
  border: 1.5px solid var(--line);
  border-top-left-radius: 0 !important;
  border-bottom-left-radius: 0 !important;
  border-top-right-radius: 999px;
  border-bottom-right-radius: 999px;
  border-left: none !important;
  color: var(--blue-600);
  font-size: .84rem;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: opacity .2s ease, all .15s ease;
}
.nearby-banner svg{flex-shrink:0;}
[data-theme="dark"] .nearby-banner{ border-color:rgba(96,165,250,.25); }


/* ============================= */
/* 3B. SEARCH / EXPLORE SCREEN    */
/* ============================= */
/* Full-screen overlay opened from the header's search icon. Deliberately
   has NO #appHeader above it (that's hidden while this is open) — its own
   top row (back button + search bar) acts as the only "header",
   Instagram-style.
   #searchView itself is just a plain, non-scrolling shell now (its only
   job is the single .hidden toggle that shows/hides both children at
   once). .search-screen-top and .explore-scroll are independent
   position:fixed SIBLINGS — exactly the #appHeader + .view-panel pattern
   used for the feed/profile/detail screens — because nesting the fixed
   header INSIDE the fixed *scrolling* container was what let a swipe on
   the grid visually drag the header (and, in turn, the bottom nav) along
   with it once the keyboard was open. Separate fixed layers can't drag
   each other. */
#searchView{
  z-index:900;
}
.search-screen-top{
  position:fixed; top:0; left:0; right:0; z-index:901;
  display:flex; align-items:center; gap:8px;
  height:var(--search-header-h);
  padding:0 16px;
  background:var(--bg);
}
.search-screen-back{
  width:36px; height:36px; border-radius:50%; border:none; background:none;
  color:var(--ink); display:flex; align-items:center; justify-content:center; flex-shrink:0;
  transition:background .15s ease, transform .1s ease;
}
.search-screen-back:active{background:var(--line); transform:scale(.93);}
.search-screen-inputwrap{position:relative; flex:1;}
.search-screen-inputwrap .search-icon{left:12px;}
.search-screen-input{
  width:100%; padding:10px 38px 10px 36px; border-radius:var(--radius-md);
  border:1.5px solid var(--line); background:var(--card); color:var(--ink);
  font-size:.9rem; font-family:inherit; outline:none;
}
/* Focus deliberately looks IDENTICAL to the resting state — no border
   color change, no glow, nothing — the user does not want any visual
   change at all when tapping into this box. */
.search-screen-input:focus{border-color:var(--line); box-shadow:none;}
.search-screen-clear{
  position:absolute; top:50%; right:10px; transform:translateY(-50%);
  width:22px; height:22px; margin:0; padding:0; border-radius:50%; border:none;
  background:var(--line); color:var(--ink-soft); font-size:.68rem; line-height:1;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
/* Voice search on the live search screen — same mic + pulsing red
   "listening" state as the header mic, only ever shown when the box is
   empty (swaps places with the Clear (X) button the instant there's
   text, both anchored at the same spot). While listening/searching the
   input's placeholder is swapped to the localized status text and
   restored automatically afterwards — the input's real value is only
   ever set once the final transcript is ready. */
.search-screen-mic{
  position:absolute; top:50%; right:8px; transform:translateY(-50%);
  width:28px; height:28px; margin:0; padding:0; border-radius:50%; flex-shrink:0;
  background:transparent; border:none;
  display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
  box-shadow:none; cursor:pointer;
  transition:transform .1s ease, background .15s ease, color .15s ease;
}
.search-screen-mic:active{ transform:translateY(-50%) scale(.9); }
/* Same native-Android-style blink as the header mic — no color change,
   just a steady show/hide flicker while actively listening. */
.search-screen-mic.listening{
  animation:micBlink 1s steps(1, end) infinite;
}
/* THE scrollable layer for this screen — same hardware-accelerated,
   overscroll-locked recipe as .view-panel below, so it behaves exactly as
   robustly as the feed/profile/detail scrolling already does. Sits below
   the fixed header and stops above the (fixed, keyboard-independent)
   bottom nav / on-screen keyboard. */
.explore-scroll{
  position:fixed; top:var(--search-header-h); left:0; right:0;
  bottom:calc(var(--nav-h) + var(--kb-inset, 0px));
  z-index:900;
  background:var(--bg);
  overflow-y:auto; overflow-x:hidden;
  overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
  transform:translateZ(0);
  will-change:scroll-position;
  transition:bottom .12s ease;
}
.explore-grid{
  display:grid; grid-template-columns:repeat(3, 1fr); gap:2px; padding:2px;
}
.explore-tile{
  position:relative; aspect-ratio:1/1; overflow:hidden; background:var(--line); cursor:pointer;
}
.explore-tile img{width:100%; height:100%; object-fit:cover;}
.explore-empty{
  grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--ink-soft);
}

/* ============================= */
/* 4. MAIN / FEED                 */
/* ============================= */
/* THE one scrollable middle layer. Applied to #mainContent, #profileView
   and #detailView (only one is ever unhidden at a time) so a swipe on the
   feed, profile or product page can never drag #appHeader / #bottomNav —
   both position:fixed — along with it. Hardware-accelerated + overscroll
   locked down for silky, native-feeling 60fps scrolling with zero
   pull-to-refresh / rubber-band bounce and zero refresh-like flicker. */
.view-panel{
  position:fixed;
  top:var(--header-h);
  left:0; right:0;
  bottom:calc(var(--nav-h) + var(--kb-inset, 0px));
  z-index:1;
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
  transform:translateZ(0);
  will-change:scroll-position;
  padding-top:6px;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
  transition:bottom .12s ease;
}
/* Profile screen has no #appHeader above it at all now — let it own the
   full viewport height from the very top instead of leaving the usual
   header-height gap reserved for the other views. */
#profileView{ top:0 !important; }
#detailView{ top:0 !important; }
.feed-grid{
  display:grid; grid-template-columns:repeat(2, 1fr); gap:14px; padding:0 14px;
  max-width:1200px; margin:0 auto;
}
@media (min-width:640px){ .feed-grid{grid-template-columns:repeat(3, 1fr);} }
@media (min-width:960px){ .feed-grid{grid-template-columns:repeat(4, 1fr); gap:18px; padding:0 20px;} }

.btn-loadmore-fixed{

    inset 0 -2px 0 rgba(0,50,40,.35),
    0 4px 12px rgba(37,211,102,.28),
    0 14px 26px rgba(0,50,40,.28);
  transition:transform .12s ease, box-shadow .12s ease, opacity .15s ease;

/* ============================= */
/* 5. BOTTOM NAV                  */
/* ============================= */
/* Deliberately NEVER moves with the on-screen keyboard (--kb-inset is not
   used here) — when the keyboard opens it simply covers/hides this nav
   like it would in any native app, instead of floating above it. */
nav#bottomNav {
  position: fixed !important;
  bottom: 0 !important;
  left: 0 !important;
  right: 0 !important;
  width: 100% !important;
  max-width: 100% !important;
  margin: 0 auto !important;
  transform: none !important;
  z-index: 500;
  flex-shrink: 0;
  touch-action: pan-x pan-y;
  background: var(--card) !important;
  border: none !important;
  border-top: 1px solid var(--line) !important;
  border-radius: 0 !important;
  box-shadow: 0px -1px 6px rgba(0, 0, 0, 0.05) !important;
  display: flex !important;
  align-items: center !important;
  justify-content: space-around !important;
  padding: 6px 16px calc(4px + env(safe-area-inset-bottom)) !important;
  backdrop-filter: none;
}
/* Higher specificity (id + class) than the rule above on purpose — .hidden
   alone (a plain class selector) cannot win against "nav#bottomNav"'s own
   !important id-selector rule, which is exactly why the buttons kept
   showing on the Search screen even after JS added the "hidden" class.
   This is the rule that actually makes hiding it work. */
nav#bottomNav.hidden{
  display: none !important;

/* Keeps --header-h in sync with the header's real rendered height so feed
   cards / titles never end up hidden underneath the fixed header — this

   banner cause the header to wrap onto extra lines on narrow screens. */
function syncHeaderHeight(){

  if(!header) return;
  const h = header.offsetHeight;
  if(h > 0){
    document.documentElement.style.setProperty("--header-h", h + "px");

  return p && p.title && p.price != null && Array.isArray(p.images) && p.images.length > 0 && p.images[0];

function sanitizePhone(phone){
  return String(phone||"").replace(/\D/g,"");
}
/* ==========================================================
   PHONE COUNTRY-CODE FORMATTING (India, +91)
   Numbers are stored as plain 10-digit local numbers, but every
   WhatsApp (wa.me) and Call (tel:) link built from a saved number
   goes through these two helpers so the country code is applied
   automatically and consistently everywhere, with no manual
   per-button prefixing. If a number was already saved with a
   leading 91/+91 (11-12 digits), it's normalized to the last 10
   digits first so it's never double-prefixed.
   ========================================================== */
function localTenDigitPhone(phone){
  const digits = sanitizePhone(phone);
  return digits.length > 10 ? digits.slice(-10) : digits;
}
function waPhoneLink(phone){
  // wa.me expects the country code with NO leading "+".
  return "91" + localTenDigitPhone(phone);
}
function telPhoneLink(phone){
  // tel: links use the leading "+" form.
  return "+91" + localTenDigitPhone(phone);
}
function sleep(ms){
  return new Promise(resolve => setTimeout(resolve, ms));
}

/* ==========================================================
   LOCAL STORAGE CACHE (Stale-While-Revalidate)
   ========================================================== */
function readCache(){
  try{
    const raw = localStorage.getItem(LOCAL_CACHE_KEY);
    if(!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function writeCache(posts){
  try{
    const sorted = [...posts].sort((a,b)=>(b._ts||0)-(a._ts||0));
    const capped = sorted.slice(0, LOCAL_CACHE_CAP);
    localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(capped));
    localStorage.setItem(CACHE_TS_KEY, String(Date.now()));
  }catch(e){ /* storage full or blocked - fail silently */ }
}
// Cache abhi bhi "fresh" hai ya nahi — fresh hone par initFeed() Firestore
// ko bilkul nahi chhuta, sirf cache se render karta hai.
function isCacheFresh(){
  try{
    const ts = Number(localStorage.getItem(CACHE_TS_KEY) || 0);
    return (Date.now() - ts) < CACHE_FRESH_MS;
  }catch(e){ return false; }
}
function mergeIntoCache(newPosts){
  const cache = readCache();
  const map = new Map(cache.map(p=>[p.id, p]));
  newPosts.forEach(p=> map.set(p.id, p));
  writeCache(Array.from(map.values()));
}
function removeFromCache(id){
  const cache = readCache().filter(p=>p.id !== id);
  writeCache(cache);
}

/* ==========================================================
   FIRESTORE HELPERS
   ========================================================== */
function docToPost(docSnap){
  const data = docSnap.data();
  const ts = data.createdAt && data.createdAt.toMillis ? data.createdAt.toMillis() : Date.now();
  return {
    id: docSnap.id,
    title: data.title || "",
    price: data.price || 0,
    description: data.description || "",
    location: data.location || "",
    phone: data.phone || "",
    category: data.category || "Home",
    images: Array.isArray(data.images) ? data.images : [],
    ownerUid: data.ownerUid || "",
    ownerName: data.ownerName || "",
    _ts: ts
  };
}

async function fetchInitialPosts(){
  const q = query(collection(db, POSTS_COLLECTION), orderBy("createdAt","desc"), limit(PAGE_SIZE_INITIAL));
  const snap = await getDocs(q);
  lastVisibleDoc = snap.docs.length ? snap.docs[snap.docs.length-1] : null;
  // "reachedEnd" is based on the RAW page size Firestore returned, not on
  // how many of those docs pass isValidPost() — a page that happens to be
  // full of malformed posts still means there may be more real posts ahead.
  const reachedEnd = snap.docs.length < PAGE_SIZE_INITIAL;
  const posts = snap.docs.map(docToPost).filter(isValidPost);
  return { posts, reachedEnd };
}

async function fetchMorePosts(){
  if(!lastVisibleDoc) return { posts: [], reachedEnd: true };
  const q = query(
    collection(db, POSTS_COLLECTION),
    orderBy("createdAt","desc"),
    startAfter(lastVisibleDoc),
    limit(PAGE_SIZE_MORE)
  );
  const snap = await getDocs(q);
  const reachedEnd = snap.docs.length < PAGE_SIZE_MORE;
  lastVisibleDoc = snap.docs.length ? snap.docs[snap.docs.length-1] : lastVisibleDoc;
  const posts = snap.docs.map(docToPost).filter(isValidPost);
  return { posts, reachedEnd };
}

async function fetchMyPosts(uid){
  const q = query(collection(db, POSTS_COLLECTION), where("ownerUid","==",uid), orderBy("createdAt","desc"), limit(100));
  const snap = await getDocs(q);
  return snap.docs.map(docToPost).filter(isValidPost);
}

/* ==========================================================
   MULTILINGUAL / PARTIAL SEARCH ENGINE
   ----------------------------------------------------------
   Two problems this solves:
   1) PARTIAL TITLE MATCH — a product titled "Rajasthani Nashik
      Dhol" should still show up when someone searches only
      "Rajasthani Dhol" (words in between shouldn't block a
      match). Fixed by splitting the query into words and
      requiring each word to appear *somewhere* in the post's
      text, instead of requiring the whole phrase as one
      contiguous substring.
   2) CROSS-LANGUAGE MATCH — a product typed in English
      ("Dhol") should be found by a Hindi search ("ढोल") and
      vice-versa. There's no translation API call here (kept
      fully offline/instant), so we transliterate Devanagari
      (Hindi script) into a Roman/English phonetic spelling
      using a standard letter-by-letter scheme, and match that
      alongside the original text. This covers the common case
      of an Indian word simply being typed in a different
      script (e.g. ढोल -> "dhol", राजस्थानी -> "rajasthani").
   ========================================================== */

// Devanagari -> Roman phonetic transliteration tables. Vowels/matras use
// the single-letter "Hinglish" spelling style people actually type
// (rajasthani, not raajasthaanii) rather than formal IAST doubling.
const DEV_VOWELS = {
  "अ":"a","आ":"a","इ":"i","ई":"i","उ":"u","ऊ":"u","ऋ":"ri",
  "ॠ":"ri","ए":"e","ऐ":"ai","ओ":"o","औ":"au"
};
const DEV_MATRAS = {
  "ा":"a","ि":"i","ी":"i","ु":"u","ू":"u","ृ":"ri","ॄ":"ri",
  "े":"e","ै":"ai","ो":"o","ौ":"au","ं":"n","ः":"h","ँ":"n"
};
const DEV_CONSONANTS = {
  "क":"k","ख":"kh","ग":"g","घ":"gh","ङ":"ng",
  "च":"ch","छ":"chh","ज":"j","झ":"jh","ञ":"ny",
  "ट":"t","ठ":"th","ड":"d","ढ":"dh","ण":"n",
  "त":"t","थ":"th","द":"d","ध":"dh","न":"n",
  "प":"p","फ":"ph","ब":"b","भ":"bh","म":"m",
  "य":"y","र":"r","ल":"l","व":"v",
  "श":"sh","ष":"sh","स":"s","ह":"h",
  "ळ":"l","ड़":"r","ढ़":"rh","फ़":"f","ज़":"z","क़":"q","ग़":"gh","ख़":"kh"
};
const DEV_VIRAMA = "्";
const DEV_RANGE = /[\u0900-\u097F]/;

/* Converts a string containing Devanagari (Hindi) characters into a
   rough Roman/phonetic spelling so it can be compared against Latin
   text (e.g. ढोल -> "dhol", राजस्थानी -> "rajasthani"). Any character
   that isn't Devanagari (English letters, digits, punctuation, spaces)
   passes through untouched, so English text is returned unchanged.
   Applies word-final "schwa deletion" — the silent inherent vowel that
   Hindi drops at the end of a word (ढोल is pronounced "dhol", not
   "dhola") — by only adding the default "a" after a consonant when the
   word continues, not when the consonant is the last letter typed. */
function transliterateHindi(str){
  if(!str) return "";
  if(!DEV_RANGE.test(str)) return str.toLowerCase(); // no Hindi chars, nothing to do
  let out = "";
  const chars = Array.from(str);
  for(let i=0; i<chars.length; i++){
    const c = chars[i];
    if(DEV_CONSONANTS[c]){
      const next = chars[i+1];
      if(next === DEV_VIRAMA){
        out += DEV_CONSONANTS[c]; // consonant with no vowel sound
        i += 1; // skip virama
      } else if(next && DEV_MATRAS[next]){
        out += DEV_CONSONANTS[c] + DEV_MATRAS[next];
        i += 1; // skip matra, already consumed
      } else if(next && DEV_RANGE.test(next)){
        out += DEV_CONSONANTS[c] + "a"; // word continues: keep inherent "a"
      } else {
        out += DEV_CONSONANTS[c]; // word-final consonant: schwa dropped
      }
      continue;
    }
    if(DEV_VOWELS[c]){ out += DEV_VOWELS[c]; continue; }
    if(DEV_MATRAS[c]){ out += DEV_MATRAS[c]; continue; } // stray matra
    if(c === DEV_VIRAMA){ continue; }
    out += c; // non-Devanagari char (English/number/space/punct) as-is
  }
  return out.toLowerCase();
}

/* Small bilingual dictionary for common resale-marketplace words whose
   Hindi and English forms don't algorithmically match even after
   transliteration (loanwords like "mobile"/"मोबाइल" render phonetically
   as "mobail", not "mobile"). If a post's text contains ANY term from a
   group, every term in that group gets added to its search haystack —
   so a title written in only one language/script is still found by a
   search typed in the other. Extend this list over time as needed. */
const SEARCH_SYNONYM_GROUPS = [
  ["dhol","ढोल","ढोलक","dholak","drum"],
  ["mobile","phone","फोन","मोबाइल","मोबाईल","smartphone","स्मार्टफोन"],
  ["cycle","bicycle","साइकिल","साइकल"],
  ["bike","motorcycle","बाइक","मोटरसाइकिल","scooter","स्कूटर"],
  ["car","गाड़ी","कार"],
  ["chair","कुर्सी"],
  ["table","मेज","टेबल"],
  ["sofa","couch","सोफा"],
  ["bed","बिस्तर","पलंग","बेड"],
  ["fridge","refrigerator","फ्रिज","फ़्रिज"],
  ["tv","television","टीवी","टेलीविजन"],
  ["laptop","लैपटॉप","computer","कंप्यूटर"],
  ["book","books","किताब","किताबें","पुस्तक"],
  ["clothes","cloth","कपड़ा","कपड़े"],
  ["shoes","shoe","जूते","जूता"],
  ["watch","घड़ी"],
  ["bag","बैग","थैला"],
  ["washing machine","वॉशिंग मशीन"],
  ["ac","air conditioner","एसी"],
  ["cooler","कूलर"],
  ["fan","पंखा"],
  ["utensils","बर्तन"],
  ["toy","toys","खिलौना","खिलौने"],
  ["guitar","गिटार"],
  ["harmonium","हारमोनियम"],
  ["tabla","तबला"],
  ["furniture","फर्नीचर"],
  ["gold","सोना"],
  ["silver","चांदी"],
  ["jewellery","jewelry","गहने","ज़ेवर"]
];

/* Builds (and caches on the post object) a single lowercase search
   "haystack" per post containing the title/description/location in
   their original script, their Roman transliteration, AND any synonym
   terms unlocked by SEARCH_SYNONYM_GROUPS — so a query in either Hindi
   or English can match either script. Also caches the same text split
   into individual unique words (post._searchWords), used by the
   typo-tolerant fuzzy match below. Cached under _searchIndex so this
   heavier work only ever runs once per post, not every keystroke. */
function getSearchIndex(post){
  if(post._searchIndex) return post._searchIndex;
  const raw = [post.title, post.description, post.location].filter(Boolean).join(" ").toLowerCase();
  const translit = transliterateHindi(raw);
  let index = raw + " " + translit;
  SEARCH_SYNONYM_GROUPS.forEach(group=>{
    if(group.some(term=> raw.includes(term))) index += " " + group.join(" ");
  });
  post._searchIndex = index;
  post._searchWords = [...new Set(index.split(/\s+/).filter(w=>w.length>=2))];
  return index;
}

/* Classic Levenshtein (edit-distance) DP — how many single-letter
   insert/delete/substitute steps turn word `a` into word `b`. Used
   below so a mistyped/incomplete search word (e.g. "dal" or "color")
   can still find a product titled "Dhol" or "Cooler" even though
   neither is a substring of the other. */
function levenshteinDistance(a, b){
  const m = a.length, n = b.length;
  if(m===0) return n;
  if(n===0) return m;
  let prev = new Array(n+1);
  let curr = new Array(n+1);
  for(let j=0;j<=n;j++) prev[j] = j;
  for(let i=1;i<=m;i++){
    curr[0] = i;
    for(let j=1;j<=n;j++){
      const cost = a[i-1]===b[j-1] ? 0 : 1;
      curr[j] = Math.min(prev[j]+1, curr[j-1]+1, prev[j-1]+cost);
    }
    const tmp = prev; prev = curr; curr = tmp;
  }
  return prev[n];
}
// How many edits a word is allowed to be off by before it's no longer
// considered a match — scales gently with word length so short words
// stay reasonably precise while longer/typo-prone words stay forgiving.
function fuzzyMatchThreshold(len){
  return Math.max(1, Math.floor(len/3) + 1);
}
/* True if `word` (as typed, already lowercase) reasonably matches
   ANYTHING in a post's word list: exact substring first (fast, and
   still how most searches resolve), falling back to a typo-tolerant
   fuzzy check against every cached word only when no substring match
   was found — so a search for "dal"/"color" still surfaces a product
   titled "Dhol"/"Cooler". Skipped for 1-2 letter words, where fuzzy
   matching would just match everything. */
function wordMatchesPost(word, haystack, searchWords){
  if(haystack.includes(word)) return true;
  if(word.length < 3) return false;
  const threshold = fuzzyMatchThreshold(word.length);
  return searchWords.some(w=>{
    if(Math.abs(w.length - word.length) > threshold) return false; // cheap early skip
    return levenshteinDistance(word, w) <= threshold;
  });
}

/* Explore/Search screen: filters ALL loaded posts by the text typed into
   #exploreSearchInput (activeSearch), ignoring category entirely — like
   Instagram's search results, which aren't scoped to a feed tab.
   Matching rules:
   - Query is split into individual words; EVERY word must be found
     somewhere in the post (title/description/location) — not
     necessarily next to each other. This lets "Rajasthani Dhol" match
     a product titled "Rajasthani Nashik Dhol".
   - Each word is checked both as typed AND transliterated, against a
     haystack that itself contains both the original script and its
     transliteration — so Hindi queries match English-titled products
     and English queries match Hindi-titled products. */
function getExploreFilteredPosts(){
  const s = activeSearch.trim().toLowerCase();
  if(!s) return allPosts;
  const words = s.split(/\s+/).filter(Boolean);
  return allPosts.filter(p=>{
    const haystack = getSearchIndex(p);
    const searchWords = p._searchWords;
    return words.every(word=>{
      const translitWord = transliterateHindi(word);
      return wordMatchesPost(word, haystack, searchWords) ||
             (translitWord !== word && wordMatchesPost(translitWord, haystack, searchWords));
    });
  });
}

/* Fixed corner Load More button — contextual visibility:
   - Hidden outright when the user isn't on the Home feed (Profile, Item
     Detail, or any other view).
   - Hidden while the search input is focused (the on-screen keyboard is
     likely covering the bottom of the screen) — restored the moment
     focus is lost.
   - On Home with category "All" and no active search: always visible,
     regardless of how many posts are currently rendered.
   - Whenever there's an active search or a specific category filter:
     visible only while that filtered view actually has product cards on
     screen — hidden the instant it shows "No items found" / 0 cards. */
function updateLoadMoreVisibility(filteredCount){
  const btn = document.getElementById("loadMoreBtn");
  if(!btn) return;
  if(currentView !== "home" || isSearchInputFocused){
    btn.classList.add("hidden");
    return;
  }
  const count = filteredCount != null ? filteredCount : getFilteredPosts().length;
  const isSearching = !!activeSearch.trim();
  const shouldShow = count > 0 || (activeCategory === "All" && !isSearching);
  btn.classList.toggle("hidden", !shouldShow);
}

function renderFeed(append=false){
  const grid = document.getElementById("feedGrid");
  const posts = getFilteredPosts();
  updateNearbyBannerVisibility();
  updateLoadMoreVisibility(posts.length);

  if(!append){
    if(posts.length===0){
      grid.innerHTML = `
      <div class="empty-state">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <h3>${t("noResults")}</h3>
        <p>${t("noResultsSub")}</p>
      </div>`;
      return;
    }
    grid.innerHTML = posts.map(cardTemplate).join("");
  } else {
    const existingIds = new Set(Array.from(grid.querySelectorAll(".card")).map(el=>el.dataset.id));
    const newHtml = posts.filter(p=>!existingIds.has(p.id)).map(cardTemplate).join("");
    grid.insertAdjacentHTML("beforeend", newHtml);
  }
}

function setLoadMoreLoading(btn, isLoading){
  const spinner = document.getElementById("loadMoreSpinner");
  const label = document.getElementById("loadMoreLabel");
  btn.disabled = isLoading;
  if(spinner) spinner.classList.toggle("hidden", !isLoading);
  if(label) label.textContent = isLoading ? t("loading") : t("loadMore");
}

async function handleLoadMore(){
  const btn = document.getElementById("loadMoreBtn");
  if(!btn || btn.disabled) return;
  setLoadMoreLoading(btn, true);
  try{
    // Fetch the next 20 products and give the spinner a smooth, deliberate
    // minimum ~2s so it never feels like a flicker, even on a fast network.
    const [result] = await Promise.all([ fetchMorePosts(), sleep(2000) ]);
    noMorePosts = result.reachedEnd;

    if(result.posts.length){
      const ids = new Set(allPosts.map(p=>p.id));
      const fresh = result.posts.filter(p=>!ids.has(p.id));
      allPosts = [...allPosts, ...fresh];
      mergeIntoCache(fresh); // merges + re-applies the 200-post cache cap
      renderFeed(true);
    } else {
      // Zero new posts came back — Firestore has nothing further to give
      // us right now. Say so, but the button itself always stays visible
      // so the user is never blocked from trying again later.
      showToast(t("toastNoMoreProducts"));
    }
  }catch(e){
    console.error(e);
    showToast(t("toastError"));
  }finally{
    // Always runs — success, empty page, or a thrown error — so the
    // spinner can never get stuck on and the button state stays correct.
    setLoadMoreLoading(btn, false);
    updateLoadMoreVisibility();
  }
}
document.getElementById("loadMoreBtn").addEventListener("click", handleLoadMore);

/* Manual/forced refresh: agar aage chal kar koi "refresh" button ya
   pull-to-refresh gesture add karna ho, to TTL ko ignore karke seedha
   isse call karo — yeh hamesha Firestore se fresh data mangata hai. */
async function forceRefreshFeed(){
  try{
    const { posts: fresh, reachedEnd } = await fetchInitialPosts();
    allPosts = fresh;
    noMorePosts = reachedEnd;
    writeCache(fresh);
    renderFeed(false);
  }catch(e){
    console.error("Firestore refresh failed:", e);
    showToast(t("toastError"));
  }
}

/* ==========================================================
   INIT FEED: cache-first, then network (with TTL to save Firestore reads)
   ========================================================== */
async function initFeed(){
  const cached = readCache();
  if(cached.length){
    allPosts = cached.filter(isValidPost);
    renderFeed(false);
    if(isCacheFresh()){
      // Cache abhi bhi taaza hai (5 min ke andar) — Firestore ko is baar
      // bilkul mat pucho. Yahi wo cheez hai jo baar-baar app kholne par
      // reads quota bachati hai. Force-refresh ke liye refreshFeed() use karo.
      return;
    }
  } else {
    renderSkeletons(8);
  }

  try{
    const { posts: fresh, reachedEnd } = await fetchInitialPosts();
    allPosts = fresh;
    noMorePosts = reachedEnd;
    writeCache(fresh);
    renderFeed(false);
  }catch(e){
    console.error("Firestore fetch failed:", e);
    if(!cached.length){
      document.getElementById("feedGrid").innerHTML = `
      <div class="load-error">
        <p>${t("toastError")}</p>
      </div>`;
    }
  }
}

/* ==========================================================
   SEARCH HANDLERS
   ========================================================== */

let isSearchInputFocused = false;

/* ==========================================================
   KEYBOARD / VISUAL VIEWPORT LOCK
   Android's soft keyboard is the classic cause of the header/nav
   "floating away" bug: the page tries to scroll the focused input
   into view, but html/body are now permanently non-scrolling (see
   the native-app sandbox in <style>), so #appHeader and #bottomNav
   — both position:fixed — can never be dragged around by it.
   Instead we measure exactly how much the keyboard has eaten into
   the visual viewport and feed that into --kb-inset, which only
   ever resizes the active .view-panel's bottom edge (and lets the
   bottom nav ride just above the keyboard) — the header never
   moves at all.
   ========================================================== */
function updateViewportInsets(){
  if(!window.visualViewport) return;
  const vv = window.visualViewport;
  const kbInset = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
  document.documentElement.style.setProperty("--kb-inset", kbInset + "px");
}
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", updateViewportInsets);
  window.visualViewport.addEventListener("scroll", updateViewportInsets);
}

/* ==========================================================
   EXPLORE / SEARCH SCREEN
   Opened via the search icon in the header. No #appHeader of its own —
   just a sticky back button + search bar (Instagram-style), followed by
   a 3-column grid of every product's cover photo. Tapping a tile opens
   the same product detail card used everywhere else in the app; its
   Back button returns here (not to the home feed) via detailReturnView.
   ========================================================== */
const exploreSearchInput = document.getElementById("exploreSearchInput");
const exploreSearchClear = document.getElementById("exploreSearchClear");
const exploreMicBtn = document.getElementById("exploreMicBtn");
const exploreGrid = document.getElementById("exploreGrid");
const exploreScroll = document.getElementById("exploreScroll");

/* THE actual fix for the "header/cards drag upward with the list" bug:
   instead of fighting Android Chrome's keyboard+scroll viewport quirks,
   sidestep them completely. The instant a finger touches the scrollable
   product list while the search keyboard is open, immediately close
   (blur) the keyboard — AND, critically, cancel that very touch's own
   scroll/drag with preventDefault() so it can't turn into a scroll at
   the same time the keyboard is mid-close-animation (that overlap in a
   single continuous touch-and-drag, without lifting the finger first,
   was exactly what let the old glitch sneak back in on a plain browser
   tab). The keyboard closes cleanly on this first touch; the very next
   touch (finger lifted and placed down again) then scrolls with zero
   keyboard involvement at all, glitch-free. */
["touchstart","pointerdown"].forEach(evt=>{
  exploreScroll.addEventListener(evt, (e)=>{
    if(document.activeElement === exploreSearchInput){
      if(e.cancelable) e.preventDefault();
      exploreSearchInput.blur();
    }
  }, {passive:false});
});

/* Covers the one gesture the guard above cannot see: a single continuous
   touch that starts ON the search box itself (which is how it got
   focused/typed into in the first place) and, without the finger ever
   lifting, drags straight up into the list to scroll. Touch events keep
   firing on their original target for the rest of that gesture, so
   exploreScroll's own touchstart above never sees it — only a
   document-level, capture-phase touchmove does, since capture fires
   before the input's own handling and before any scroll can start.
   The instant that first movement is detected while the box is still
   focused, the keyboard is blurred and that one tick's default action is
   cancelled — pushing the keyboard/typing box fully out of the way
   BEFORE anything moves, so #searchView's fixed header never shifts and
   only the grid underneath scrolls. Once blurred, activeElement is no
   longer the input, so every following touchmove of that same drag is
   left alone and scrolls completely normally. */
document.addEventListener("touchmove", (e)=>{
  if(document.activeElement === exploreSearchInput){
    if(e.cancelable) e.preventDefault();
    exploreSearchInput.blur();
  }
}, {passive:false, capture:true});

function exploreTileTemplate(post){
  const img = post.images[0];
  return `<div class="explore-tile" data-id="${post.id}"><img src="${escapeHtml(img)}" alt="${escapeHtml(post.title)}" loading="lazy"></div>`;
}
function renderExploreGrid(){
  const posts = getExploreFilteredPosts();
  if(posts.length===0){
    exploreGrid.innerHTML = `<div class="explore-empty">${t("noResults")}</div>`;
    return;
  }
  exploreGrid.innerHTML = posts.map(exploreTileTemplate).join("");
}
exploreGrid.addEventListener("click", (e)=>{

  if(tile) openDetailView(tile.dataset.id, "search");
});

/* Shows a Clear (X) the instant text appears in the search box, same
   behavior as typing in Instagram's search bar. The mic button lives in
   the exact same spot and is shown only while the box is empty — the
   two are mutually exclusive so there's never a collision. */
function updateExploreActionIcon(){
  const hasText = exploreSearchInput.value.length>0;
  exploreSearchClear.classList.toggle("hidden", !hasText);
  if(exploreMicBtn) exploreMicBtn.classList.toggle("hidden", hasText);
}
exploreSearchInput.addEventListener("input", ()=>{
  activeSearch = exploreSearchInput.value;
  updateExploreActionIcon();
  renderExploreGrid();
});
exploreSearchInput.addEventListener("focus", ()=>{
  isSearchInputFocused = true;
  window.scrollTo(0,0);
  document.body.classList.add("kb-open");
  updateViewportInsets();
});
exploreSearchInput.addEventListener("blur", ()=>{
  isSearchInputFocused = false;
  document.body.classList.remove("kb-open");
  document.documentElement.style.setProperty("--kb-inset", "0px");
  window.scrollTo(0,0);
});
exploreSearchClear.addEventListener("mousedown", (e)=> e.preventDefault());
exploreSearchClear.addEventListener("click", ()=>{
  exploreSearchInput.value = "";
  activeSearch = "";
  updateExploreActionIcon();
  renderExploreGrid();
  exploreSearchInput.focus();
});

function openSearchView(){
  currentView = "search";
  document.getElementById("appHeader").classList.add("hidden");
  document.getElementById("bottomNav").classList.add("hidden");
  document.getElementById("mainContent").classList.add("hidden");
  document.getElementById("profileView").classList.add("hidden");
  document.getElementById("detailView").classList.add("hidden");
  document.getElementById("searchView").classList.remove("hidden");
  setActiveNav(null);
  updateLoadMoreVisibility();
  renderExploreGrid();
  // Open in a plain/normal state — no auto-focus, no keyboard popping up
  // on its own. The keyboard should only appear once the user explicitly
  // taps the search input box themselves.
}
function closeSearchView(){
  currentView = "home";
  document.getElementById("searchView").classList.add("hidden");
  document.getElementById("appHeader").classList.remove("hidden");
  document.getElementById("bottomNav").classList.remove("hidden");
  document.getElementById("mainContent").classList.remove("hidden");
  setActiveNav("home");
  updateLoadMoreVisibility();
  // Start fresh next time the screen opens.
  activeSearch = "";
  exploreSearchInput.value = "";
  updateExploreActionIcon();
}
document.getElementById("searchOpenBtn").addEventListener("click", openSearchView);
const searchScreenBackBtn = document.getElementById("searchScreenBack");
// Without this, tapping the back button while the input is focused blurs
// the input FIRST (default browser behavior on tapping outside a focused
// field), so by the time the click handler below runs, isSearchInputFocused
// has already flipped to false — making the two-stage back never trigger
// its "just dismiss the keyboard" stage. Blocking the mousedown's default
// action keeps focus (and isSearchInputFocused) exactly as it was.
searchScreenBackBtn.addEventListener("mousedown", (e)=> e.preventDefault());
searchScreenBackBtn.addEventListener("click", ()=>{
  // Two-stage back, same idea as the search screen's own opening
  // behavior: if the keyboard/input is active, the first back tap just
  // dismisses it (back to the plain/normal search screen state) — it
  // only actually leaves the search screen (goes home) once the input
  // is no longer focused.
  if(isSearchInputFocused){
    exploreSearchInput.blur();
    return;
  }
  closeSearchView();
});

/* ==========================================================
   VOICE SEARCH (header mic button)
   Tapping the mic next to the "What are you looking for?" text plate
   listens for speech — same idea as YouTube's voice search — then opens
   the Explore/Search screen already filtered by whatever was said. The
   text plate itself stays purely decorative and is never clickable.
   ========================================================== */
const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
let voiceRecognition = null;
let isListening = false;

// Original decorative placeholder text is swapped out for the
// listening/searching status and restored afterwards, so the search bar
// looks exactly as before once voice search finishes.
const headerSearchTextEl = document.getElementById("headerSearchText");
const originalHeaderSearchText = headerSearchTextEl ? headerSearchTextEl.textContent : "";

function setVoiceStatus(state, label){
  const bar = document.getElementById("headerSearchBar");
  if(!bar) return;
  bar.classList.remove("voice-listening", "voice-searching");
  if(state){
    bar.classList.add(state);
    if(headerSearchTextEl) headerSearchTextEl.textContent = label;
  }else if(headerSearchTextEl){
    headerSearchTextEl.textContent = originalHeaderSearchText;
  }
}

function performVoiceSearch(transcript){
  activeSearch = transcript;
  exploreSearchInput.value = transcript;
  updateExploreActionIcon();
  openSearchView();
}

function startVoiceSearch(){
  const micBtn = document.getElementById("headerMicBtn");
  if(!SpeechRecognitionCtor){
    showToast(t("voiceNotSupported"));
    return;
  }
  if(isListening) return;

  voiceRecognition = new SpeechRecognitionCtor();
  voiceRecognition.lang = currentLang === "hi" ? "hi-IN" : "en-IN";
  voiceRecognition.interimResults = false;
  voiceRecognition.maxAlternatives = 1;

  let gotResult = false;
  isListening = true;
  if(micBtn) micBtn.classList.add("listening");
  setVoiceStatus("voice-listening", t("voiceListening"));

  voiceRecognition.addEventListener("result", (e)=>{
    const transcript = e.results[0][0].transcript;
    if(transcript && transcript.trim()){
      gotResult = true;
      setVoiceStatus("voice-searching", t("voiceSearching"));
      setTimeout(()=>{
        setVoiceStatus(null);
        performVoiceSearch(transcript.trim());
      }, 500);
    }else{
      setVoiceStatus(null);
    }
  });
  voiceRecognition.addEventListener("end", ()=>{
    isListening = false;
    if(micBtn) micBtn.classList.remove("listening");
    if(!gotResult) setVoiceStatus(null);
  });
  voiceRecognition.addEventListener("error", ()=>{
    isListening = false;
    if(micBtn) micBtn.classList.remove("listening");
    setVoiceStatus(null);
    showToast(t("voiceError"));
  });

  try{
    voiceRecognition.start();
  }catch(e){
    isListening = false;
    if(micBtn) micBtn.classList.remove("listening");
    setVoiceStatus(null);
  }
}
document.getElementById("headerMicBtn").addEventListener("click", (e)=>{
  e.stopPropagation();
  startVoiceSearch();
});

/* ==========================================================
   VOICE SEARCH — search screen's own mic button
   Same YouTube-style listening/searching flow as the header mic above,
   but scoped to the search screen: it fills #exploreSearchInput directly
   and re-filters the grid immediately, without reopening the search
   view (it's already open). Status is shown via the input's own
   placeholder (swapped, then restored) since — unlike the header's
   decorative text — this box holds a real value.
   ========================================================== */
let exploreVoiceRecognition = null;
let isExploreListening = false;
const originalExploreSearchPlaceholder = exploreSearchInput.placeholder;

function setExploreVoiceStatus(label){
  exploreSearchInput.placeholder = label || originalExploreSearchPlaceholder;
}

function startExploreVoiceSearch(){
  if(!SpeechRecognitionCtor){
    showToast(t("voiceNotSupported"));
    return;
  }
  if(isExploreListening) return;

  exploreVoiceRecognition.lang = currentLang === "hi" ? "hi-IN" : "en-IN";
  exploreVoiceRecognition.interimResults = false;
  exploreVoiceRecognition.maxAlternatives = 1;

  let gotResult = false;
  isExploreListening = true;
  exploreSearchInput.value = "";
  activeSearch = "";
  updateExploreActionIcon();
  if(exploreMicBtn) exploreMicBtn.classList.add("listening");
  setExploreVoiceStatus(t("voiceListening"));

  exploreVoiceRecognition.addEventListener("result", (e)=>{
    const transcript = e.results[0][0].transcript;
    if(transcript && transcript.trim()){
      gotResult = true;
      setExploreVoiceStatus(t("voiceSearching"));
      setTimeout(()=>{
        setExploreVoiceStatus(null);
        exploreSearchInput.value = transcript.trim();
        activeSearch = transcript.trim();
        updateExploreActionIcon();
        renderExploreGrid();
      }, 500);
    }else{
      setExploreVoiceStatus(null);
    }
  });
  exploreVoiceRecognition.addEventListener("end", ()=>{
    isExploreListening = false;
    if(exploreMicBtn) exploreMicBtn.classList.remove("listening");
    if(!gotResult) setExploreVoiceStatus(null);
  });
  exploreVoiceRecognition.addEventListener("error", ()=>{
    isExploreListening = false;
    if(exploreMicBtn) exploreMicBtn.classList.remove("listening");
    setExploreVoiceStatus(null);
    showToast(t("voiceError"));
  });

  try{
    exploreVoiceRecognition.start();
  }catch(e){
    isExploreListening = false;
    if(exploreMicBtn) exploreMicBtn.classList.remove("listening");
    setExploreVoiceStatus(null);
  }
}
if(exploreMicBtn){
  exploreMicBtn.addEventListener("mousedown", (e)=> e.preventDefault());

  const waBtn = e.target.closest('[data-action="whatsapp"]');
  if(waBtn){
    e.stopPropagation();
    window.open(`https://wa.me/${waBtn.dataset.phone}?text=${waBtn.dataset.msg}`, "_blank");
    return;
  }
  const callBtn = e.target.closest('[data-action="call"]');
  if(callBtn){
    e.stopPropagation();
    window.location.href = `tel:${callBtn.dataset.phone}`;
    return;
  }
  const shareBtn = e.target.closest('[data-action="share"]');
  if(shareBtn){
    e.stopPropagation();
    shareProduct(shareBtn.dataset.id);
    return;
  }
  const lbTrigger = e.target.closest('[data-action="open-lightbox"]');
  if(lbTrigger){
    openLightboxForPost(lbTrigger.dataset.id);
    return;
  }
  const detailTrigger = e.target.closest('[data-action="open-detail"]');
  if(detailTrigger){
    openDetailView(detailTrigger.dataset.id);
  }
});

function openLightboxForPost(id){

  if(!post) return;

function getAllKnownPosts(){
  return [...allPosts, ...readCache()];
}
function updateLightbox(){
  // Reset zoom/pan whenever the displayed image changes.
  lbScale = 1; lbPanX = 0; lbPanY = 0;
  applyLightboxTransform();
  document.getElementById("lightboxImg").src = lightboxImages[lightboxIndex];
  document.getElementById("lightboxCounter").textContent = `${lightboxIndex+1} / ${lightboxImages.length}`;
  document.getElementById("lightboxPrev").style.display = lightboxImages.length>1 ? "flex":"none";
  document.getElementById("lightboxNext").style.display = lightboxImages.length>1 ? "flex":"none";
}
function closeLightbox(){
  lbScale = 1; lbPanX = 0; lbPanY = 0;
  applyLightboxTransform();
  document.getElementById("lightbox").classList.remove("open");
}
document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
document.getElementById("lightboxPrev").addEventListener("click", ()=>{
  lightboxIndex = (lightboxIndex - 1 + lightboxImages.length) % lightboxImages.length;
  updateLightbox();
});
document.getElementById("lightboxNext").addEventListener("click", ()=>{
  lightboxIndex = (lightboxIndex + 1) % lightboxImages.length;
  updateLightbox();
});

/* --------------------------------------------------------
   Lightbox gestures: pinch-to-zoom + full 4-directional pan
   (left/right/up/down) while zoomed, plus swipe-to-navigate
   and double-tap-to-zoom when at 1x.
   -------------------------------------------------------- */
const lbEl = document.getElementById("lightbox");
const lbImgEl = document.getElementById("lightboxImg");
let lbScale = 1, lbPanX = 0, lbPanY = 0;
const LB_MIN_SCALE = 1, LB_MAX_SCALE = 4;

let lbMode = null;               // 'pinch' | 'pan' | 'swipe'
let lbLastPinchDist = null;
let lbLastPanPoint = null;
let lbSwipeStartX = 0, lbSwipeStartY = 0;
let lbTapStartX = 0, lbTapStartY = 0, lbTapStartTime = 0;
let lbLastTapTime = 0;

function applyLightboxTransform(animated){
  lbImgEl.style.transition = animated ? "transform .2s ease" : "none";
  lbImgEl.style.transform = `translate(${lbPanX}px, ${lbPanY}px) scale(${lbScale})`;
  if(animated){
    setTimeout(()=>{ lbImgEl.style.transition = "none"; }, 220);
  }
}
function clampPan(){
  // Keep the pan within a sensible range that grows with zoom level so the
  // image can be dragged in all four directions without flying off-screen.
  const maxOffset = (lbScale - 1) * (lbImgEl.clientWidth || 300) * 0.6;
  lbPanX = Math.max(-maxOffset, Math.min(maxOffset, lbPanX));
  lbPanY = Math.max(-maxOffset, Math.min(maxOffset, lbPanY));
}

lbEl.addEventListener("touchstart",(e)=>{
  if(e.touches.length===2){
    lbMode = "pinch";
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    lbLastPinchDist = Math.hypot(dx,dy);
  } else if(e.touches.length===1){
    lbTapStartX = e.touches[0].clientX;
    lbTapStartY = e.touches[0].clientY;
    lbTapStartTime = Date.now();
    if(lbScale > 1.01){
      lbMode = "pan";
      lbLastPanPoint = {x:e.touches[0].clientX, y:e.touches[0].clientY};
    } else {
      lbMode = "swipe";
      lbSwipeStartX = e.touches[0].clientX;
      lbSwipeStartY = e.touches[0].clientY;
    }
  }
}, {passive:true});

lbEl.addEventListener("touchmove",(e)=>{
  if(lbMode==="pinch" && e.touches.length===2){
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx,dy);
    if(lbLastPinchDist != null){
      lbScale = Math.min(LB_MAX_SCALE, Math.max(LB_MIN_SCALE, lbScale * (dist / lbLastPinchDist)));
      clampPan();
      applyLightboxTransform();
    }
    lbLastPinchDist = dist;
  } else if(lbMode==="pan" && e.touches.length===1){
    e.preventDefault();
    const dx = e.touches[0].clientX - lbLastPanPoint.x;
    const dy = e.touches[0].clientY - lbLastPanPoint.y;
    lbPanX += dx;
    lbPanY += dy;
    clampPan();
    lbLastPanPoint = {x:e.touches[0].clientX, y:e.touches[0].clientY};
    applyLightboxTransform();
  }
  // 'swipe' mode: resolved on touchend (navigation only happens at 1x zoom).
}, {passive:false});

lbEl.addEventListener("touchend",(e)=>{
  if(lbMode==="swipe" && lbScale <= 1.01){
    const touch = e.changedTouches[0];
    const dx = touch.clientX - lbSwipeStartX;
    const dy = touch.clientY - lbSwipeStartY;
    const elapsed = Date.now() - lbTapStartTime;
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) && lightboxImages.length>1){
      if(dx > 0) lightboxIndex = (lightboxIndex - 1 + lightboxImages.length) % lightboxImages.length;
      else lightboxIndex = (lightboxIndex + 1) % lightboxImages.length;
      updateLightbox();
    } else if(Math.abs(dx) < 12 && Math.abs(dy) < 12 && elapsed < 300){
      // Tap (not a swipe) — check for double-tap to zoom.
      const now = Date.now();
      if(now - lbLastTapTime < 320){
        if(lbScale > 1.01){
          lbScale = 1; lbPanX = 0; lbPanY = 0;
        } else {
          lbScale = 2.4;
        }
        applyLightboxTransform(true);
        lbLastTapTime = 0;
      } else {
        lbLastTapTime = now;
      }
    }
  }

  if(e.touches.length===0){
    lbMode = null;
    lbLastPinchDist = null;
    lbLastPanPoint = null;
    if(lbScale < 1.02){ lbScale = 1; lbPanX = 0; lbPanY = 0; applyLightboxTransform(); }
  } else if(e.touches.length===1){
    // Transitioned from a two-finger pinch down to one finger.
    if(lbScale > 1.01){
      lbMode = "pan";
      lbLastPanPoint = {x:e.touches[0].clientX, y:e.touches[0].clientY};
    } else {
      lbMode = "swipe";
      lbSwipeStartX = e.touches[0].clientX;
      lbSwipeStartY = e.touches[0].clientY;
    }
  }
}, {passive:true});

lbEl.addEventListener("click",(e)=>{
  if(e.target.id==="lightbox"){
    closeLightbox();
  }
});

/* ==========================================================
   UNIVERSAL PRODUCT SHARE LINKS
   A link like https://yourapp.com/?prod=<id> must work for ANY
   user on ANY device: it opens the product's detail view directly
   on load, with no dependency on the feed already being loaded or
   on who is signed in.

   The link that gets SHARED (WhatsApp, native share sheet, "copy
   link") must always point at the real published site — never at
   whatever host/port/filename this page happens to be running on
   right now (a local test server, a random dev port, "index (1).html",
   etc). So it's hard-coded to PRODUCTION_SITE_URL below instead of
   being derived from window.location.
   ========================================================== */
const PRODUCTION_SITE_URL = "https://reshopindiaofficial-website.github.io/official-site/";

function buildShareUrl(id){
  const url = new URL(PRODUCTION_SITE_URL);
  url.searchParams.set("prod", id);
  return url.toString();
}

// Separate from buildShareUrl: this is ONLY for updating this browser's own
// address bar (history.pushState) when a detail view opens, so refresh/back
// keep working wherever the page is actually being served from right now.
// It must stay same-origin as the current page — pushState throws a
// SecurityError otherwise — so, unlike the shared link above, this one IS
// derived from window.location.
function buildLocalProductUrl(id){
  const url = new URL(window.location.href);
  url.search = "";
  url.hash = "";
  url.searchParams.set("prod", id);
  return url.toString();
}

async function shareProduct(id){
  const url = buildShareUrl(id);
  if(navigator.share){
    try{
      await navigator.share({ title:"ReShop India", text: t("shareText"), url });
      return;
    }catch(e){
      // User cancelled the native share sheet, or it failed — fall back to
      // copying the link instead of leaving the tap feeling like a dead end.
    }
  }
  try{
    await navigator.clipboard.writeText(url);
    showToast(t("toastLinkCopied"));
  }catch(e){
    try{
      const ta = document.createElement("textarea");
      ta.value = url;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      showToast(t("toastLinkCopied"));
    }catch(_){
      showToast(url);
    }
  }
}

// Resolves a product by id from whatever's already known locally (in-memory
// feed, then the localStorage cache) and, failing that, fetches it directly
// from Firestore — so a cold link opened by someone who has never had the
// feed loaded still resolves correctly.
async function getPostByIdUniversal(id){
  const known = getAllKnownPosts().find(p=>p.id===id);
  if(known) return known;
  try{
    const snap = await getDoc(doc(db, POSTS_COLLECTION, id));
    if(snap.exists()){
      const post = docToPost(snap);
      if(isValidPost(post)) return post;
    }
  }catch(e){
    console.error("Failed to resolve shared product:", e);
  }
  return null;
}

/* Per-device, single-visit share-link gating. Purely client-side via
   localStorage, so it is scoped to THIS device/browser only — it never
   affects (or is affected by) any other user opening the very same
   ?prod=<id> link on their own device, whether they're the seller, the
   person who generated the link, or the 100th stranger to open it. */
const SHARE_VISIT_KEY = "visited_share_products";

function getVisitedShareProducts(){
  try{
    const arr = JSON.parse(localStorage.getItem(SHARE_VISIT_KEY) || "[]");
    return Array.isArray(arr) ? arr : [];
  }catch(e){
    return [];
  }
}

function markShareProductVisited(id){
  try{
    const arr = getVisitedShareProducts();
    if(!arr.includes(id)){
      arr.push(id);
      localStorage.setItem(SHARE_VISIT_KEY, JSON.stringify(arr));
    }
  }catch(e){
    // localStorage unavailable/full (private browsing, quota, etc.) —
    // fail silently rather than blocking the product view.
  }
}

async function handleSharedProductLink(){
  const prodId = new URLSearchParams(window.location.search).get("prod");
  if(!prodId) return;

  if(getVisitedShareProducts().includes(prodId)){
    // REPEAT VISIT on this device: never auto-open the modal again.
    // Instantly strip ?prod= from the address bar (no reload) and let
    // the normal homepage show underneath.
    window.history.replaceState({}, document.title, window.location.pathname);
    return;
  }

  const post = await getPostByIdUniversal(prodId);
  if(post){
    if(!allPosts.some(p=>p.id===post.id)){
      allPosts = [post, ...allPosts];
    }
    // FIRST-TIME VISIT on this device: open the product modal, then
    // instantly record the visit so it never auto-opens again here.
    markShareProductVisited(prodId);
    openDetailView(post.id);
  }else{
    showToast(t("toastProductNotFound"));
    window.history.replaceState({}, document.title, window.location.pathname);
  }
}

function applyTheme(theme){
  const root = document.documentElement;
  // Freeze every element's transitions for this switch so dozens of themed
  // surfaces don't each animate their color independently (which reads as
  // a ~1s laggy cascade) — then release them once the new theme has painted.
  root.classList.add("theme-switching");

  root.setAttribute("data-theme", theme);
  localStorage.setItem("reshop_theme", theme);
  document.getElementById("themeSwitch").classList.toggle("on", theme==="dark");

  const sun = document.getElementById("themeIconSun");
  const moon = document.getElementById("themeIconMoon");
  if(sun && moon){
    const isDark = theme==="dark";
    sun.classList.toggle("hidden", isDark);
    moon.classList.toggle("hidden", !isDark);
    const visibleIcon = isDark ? moon : sun;
    // Restart the pop-in animation even if it was already applied once.
    visibleIcon.classList.remove("pop");
    void visibleIcon.offsetWidth;
    visibleIcon.classList.add("pop");
  }

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      root.classList.remove("theme-switching");
    });
  });
}
document.getElementById("themeSwitch").addEventListener("click", ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  applyTheme(cur==="dark" ? "light" : "dark");
});

const GSI_PENDING_KEY = "reshop_gsi_pending"; // localStorage: set right before we redirect to Google, cleared once we're back with an answer either way

/* Runs once Google sign-in actually succeeds, whether that came back via
   a popup (same tick) or a full-page redirect (next load). */
function onGoogleSignInSuccess(){
  closeModal(authModal);
  showToast(t("toastSignedIn"));
  if(localStorage.getItem(PENDING_SELL_KEY) === "1"){
    localStorage.removeItem(PENDING_SELL_KEY);
    // Give onAuthStateChanged/currentUser a tick to settle, then open Sell modal.
    setTimeout(()=> openSellModal(), 50);
  } else {
    localStorage.removeItem(PENDING_SELL_KEY);
  }
}

document.getElementById("googleSignInBtn").addEventListener("click", async ()=>{
  localStorage.setItem(PENDING_SELL_KEY, pendingSellOpen ? "1" : "0");
  pendingSellOpen = false;
  // Try a POPUP first. This app's authDomain is a firebaseapp.com domain
  // while the site itself is hosted elsewhere (github.io) — that's a
  // cross-site setup, and some browsers (Chrome in particular, with its
  // increasingly strict third-party storage partitioning) can silently
  // drop the state Firebase needs to carry across a FULL-PAGE redirect
  // between those two origins: no error anywhere, getRedirectResult()
  // on return just comes back empty. A popup keeps everything in one
  // still-open tab instead of navigating away and back, which sidesteps
  // that cross-origin storage hand-off entirely — so it succeeds in
  // exactly the browsers where the redirect path was going silent.
  try{
    const result = await signInWithPopup(auth, googleProvider);
    if(result && result.user){
      onGoogleSignInSuccess();
      return;
    }
  }catch(e){
    const code = e && e.code;
    if(code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request"){
      // The person closed the popup themselves — not a failure, nothing to report.
      localStorage.removeItem(PENDING_SELL_KEY);
      return;
    }
    if(code !== "auth/popup-blocked" && code !== "auth/operation-not-supported-in-this-environment"){
      // A real error, not just "popups don't work here" — report it and stop
      // (don't also attempt a redirect, which would just hit the same problem).
      console.error(e);
      localStorage.removeItem(PENDING_SELL_KEY);
      showToast(t("toastError"));
      return;
    }
    // Popup genuinely isn't available in this browser — fall through to
    // the redirect flow below, same as before.
  }
  try{
    // Flag that we're expecting getRedirectResult() to have an answer next
    // load — if we come back with neither a user nor an error, that's the
    // silent-storage-partitioning failure described above; this flag is
    // what lets handleRedirectResult() below tell "nothing happened yet"
    // apart from "the redirect quietly failed" and actually surface that.
    localStorage.setItem(GSI_PENDING_KEY, "1");
    await signInWithRedirect(auth, googleProvider);
    // Execution stops here — the browser navigates to Google and back.
  }catch(e){
    console.error(e);
    localStorage.removeItem(PENDING_SELL_KEY);
    localStorage.removeItem(GSI_PENDING_KEY);
    showToast(t("toastError"));
  }
});

// Captures the login credentials once Google redirects back to the app
// (only reached when the popup above wasn't available and we fell back
// to the redirect flow).
async function handleRedirectResult(){
  const wasPending = localStorage.getItem(GSI_PENDING_KEY) === "1";
  try{
    const result = await getRedirectResult(auth);
    if(result && result.user){
      localStorage.removeItem(GSI_PENDING_KEY);
      onGoogleSignInSuccess();
    } else if(wasPending){
      // We sent the person to Google and they came back, but there's no
      // user and no error either — the silent-failure case above. Now
      // there's an actual, specific alert instead of nothing.
      localStorage.removeItem(GSI_PENDING_KEY);
      localStorage.removeItem(PENDING_SELL_KEY);
      showToast(t("toastSignInFailed"));
    }
  }catch(e){
    console.error("Redirect sign-in error:", e);
    localStorage.removeItem(PENDING_SELL_KEY);
    localStorage.removeItem(GSI_PENDING_KEY);
    showToast(wasPending ? t("toastSignInFailed") : t("toastError"));
  }
}

const COMPRESS_TARGET_BYTES = 180 * 1024; // aim for under ~180KB after compression
const SELL_DRAFT_KEY = "reshop_sell_draft";
