<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
<title>ReShop India — Buy &amp; Sell Pre-Loved Goods</title>
<meta name="description" content="ReShop India — apna khud ka bazaar. Buy and sell used goods across India.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
/* ============================= */
/* 1. DESIGN TOKENS               */
/* ============================= */
:root{
  --blue-600:#2563eb;
  --blue-500:#3b82f6;
  --blue-50:#eff6ff;
  --green-600:#16a34a;
  --green-700:#15803d;
  --bg:#f8fafc;
  --card:#ffffff;
  --ink:#0f172a;
  --ink-soft:#475569;
  --ink-faint:#94a3b8;
  --line:#e2e8f0;
  --radius-lg:16px;
  --radius-md:12px;
  --radius-sm:8px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.08);
  --shadow-md:0 8px 24px rgba(15,23,42,.10);
  --shadow-lg:0 20px 48px rgba(15,23,42,.18);
  --header-h:120px;
  --nav-h:76px;
  --font:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
}
/* True AMOLED-style dark mode: the page background sits at near-true-black
   (#090D16) while headers/cards/bottom-nav use a very slightly lighter
   near-black (#0F172A) so surfaces still read as "elevated" against the
   background, the way native Android dark themes do. */
[data-theme="dark"]{
  --blue-600:#3b82f6;
  --blue-500:#60a5fa;
  --blue-50:#1e293b;
  --bg:#090d16;
  --card:#0f172a;
  --ink:#f1f5f9;
  --ink-soft:#cbd5e1;
  --ink-faint:#64748b;
  --line:#232c3d;
  --shadow-sm:0 1px 2px rgba(0,0,0,.45);
  --shadow-md:0 8px 24px rgba(0,0,0,.55);
  --shadow-lg:0 20px 48px rgba(0,0,0,.7);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
  transition:background .3s ease, color .3s ease;
}
button{font-family:inherit; cursor:pointer;}
img{max-width:100%; display:block;}
a{color:inherit; text-decoration:none;}
::selection{background:var(--blue-600); color:#fff;}
.hidden{display:none !important;}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}

/* Scrollbar */
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--ink-faint); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ============================= */
/* 2. SPLASH SCREEN               */
/* ============================= */
#splash{
  position:fixed; inset:0; z-index:9999;
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  background:radial-gradient(circle at 30% 20%, #3b82f6 0%, #1d4ed8 45%, #0f172a 100%);
  transition:opacity .6s ease, transform .6s ease;
}
#splash.exit{opacity:0; transform:scale(1.15); pointer-events:none;}
.splash-bag{
  width:88px; height:88px;
  animation:dropBag 1s cubic-bezier(.34,1.56,.64,1) both;
  filter:drop-shadow(0 12px 22px rgba(0,0,0,.35));
}
@keyframes dropBag{
  0%{transform:translateY(-160px) rotate(-18deg) scale(.6); opacity:0;}
  60%{transform:translateY(10px) rotate(6deg) scale(1.06); opacity:1;}
  80%{transform:translateY(-6px) rotate(-2deg) scale(.99);}
  100%{transform:translateY(0) rotate(0deg) scale(1);}
}
.splash-title{
  margin-top:22px; font-size:2.4rem; font-weight:800; color:#fff; letter-spacing:.5px;
  animation:glow 1.8s ease-in-out .5s infinite alternate;
}
@keyframes glow{
  from{text-shadow:0 0 8px rgba(255,255,255,.35), 0 0 18px rgba(96,165,250,.4);}
  to{text-shadow:0 0 20px rgba(255,255,255,.85), 0 0 42px rgba(96,165,250,.85);}
}
.splash-badge{
  margin-top:14px; padding:8px 18px; border-radius:999px;
  background:rgba(255,255,255,.14); backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.28);
  color:#e0e7ff; font-weight:600; font-size:.95rem;
  opacity:0; animation:fadeUp .8s ease 1.1s forwards;
}
@keyframes fadeUp{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);}}
.splash-loader{
  margin-top:34px; width:140px; height:4px; border-radius:4px; background:rgba(255,255,255,.2); overflow:hidden;
}
.splash-loader::after{
  content:""; display:block; height:100%; width:40%; border-radius:4px;
  background:#fff; animation:loaderMove 1.4s ease-in-out infinite;
}
@keyframes loaderMove{
  0%{transform:translateX(-100%);} 100%{transform:translateX(350%);}
}

/* ============================= */
/* 3. HEADER                      */
/* ============================= */
header#appHeader{
  position:fixed; top:0; left:0; right:0; z-index:500;
  background:var(--card);
  border-bottom:1px solid var(--line);
  box-shadow:var(--shadow-sm);
}
.header-top{
  display:flex; align-items:center; gap:12px;
  padding:14px 16px 10px;
}
.icon-btn{
  width:40px; height:40px; border-radius:var(--radius-sm);
  display:flex; align-items:center; justify-content:center;
  background:var(--bg); border:1px solid var(--line); color:var(--ink);
  flex-shrink:0; transition:background .15s ease, transform .1s ease;
}
.icon-btn:active{transform:scale(.93);}
.theme-toggle-btn{ color:var(--blue-600); position:relative; overflow:hidden; }
.theme-icon{ transition:opacity .2s ease; }
@keyframes themeIconPop{
  from{ transform:scale(.4) rotate(-100deg); opacity:0; }
  to{ transform:scale(1) rotate(0deg); opacity:1; }
}
.theme-icon.pop{ animation:themeIconPop .38s cubic-bezier(.34,1.56,.64,1); }
.header-title{
  flex:1; text-align:center; font-size:1.15rem; font-weight:800; color:var(--blue-600);
  letter-spacing:.2px;
}
.header-actions{display:flex; gap:8px; align-items:center;}
.search-wrap {
  position: relative; 
  padding: 0 16px 10px;
}

.search-input {
  width: 100%; 
  padding: 11px 40px 11px 40px; 
  border-radius: var(--radius-md);
  border: 1.5px solid var(--line); 
  background: var(--bg); 
  color: var(--ink);
  font-size: .92rem; 
  font-family: inherit; 
  outline: none;
  box-sizing: border-box;
  transition: border-color .15s ease, box-shadow .15s ease;
}

.search-input:focus {
  border-color: var(--blue-500); 
  box-shadow: 0 0 0 4px var(--blue-50);
}

.search-icon {
  position: absolute; 
  left: 28px; 
  top: calc(50% - 5px); 
  transform: translateY(-50%);
  color: var(--ink-faint); 
  pointer-events: none; 
  display: flex; 
  align-items: center;
}

/* एडिट किया गया सर्च एक्शन / क्लियर बटन */
.search-clear {
  position: absolute; 
  top: calc(50% - 5px); 
  right: 26px; 
  transform: translateY(-50%);
  width: 24px; 
  height: 24px; 
  margin: 0; 
  padding: 0; 
  border-radius: 50%; 
  border: none;
  background: var(--line); 
  color: var(--ink-soft); 
  font-size: .75rem; 
  line-height: 1;
  display: none; /* JS द्वारा display: flex में बदला जाएगा */
  align-items: center; 
  justify-content: center;
  box-sizing: border-box; 
  cursor: pointer;
  transition: background .15s ease, color .15s ease;
}

.search-clear:active {
  background: var(--ink-faint);
  color: var(--card);
}
.nearby-banner{
  position:sticky; top:calc(var(--header-h) + 8px); z-index:40;
  display:inline-flex; align-items:center; gap:5px;
  width:fit-content; max-width:calc(100% - 28px);
  margin:0 14px 12px; padding:5px 12px 5px 10px;
  background:var(--blue-50); border:1px solid var(--line);
  border-radius:999px; box-shadow:var(--shadow-sm);
  color:var(--blue-600); font-size:.74rem; font-weight:700;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  transition:opacity .2s ease;
}
.nearby-banner svg{flex-shrink:0;}
[data-theme="dark"] .nearby-banner{ border-color:rgba(96,165,250,.25); }
@media (min-width:960px){ .nearby-banner{ margin-left:20px; margin-right:20px; } }
.pills-scroll{
  display:flex; gap:8px; overflow-x:auto; padding:0 16px 12px;
  scrollbar-width:none;
}
.pills-scroll::-webkit-scrollbar{display:none;}
.pill{
  flex-shrink:0; padding:8px 16px; border-radius:999px; border:1.5px solid var(--line);
  background:var(--card); color:var(--ink-soft); font-size:.84rem; font-weight:600;
  white-space:nowrap; transition:all .15s ease;
}
.pill.active{
  background:var(--blue-600); border-color:var(--blue-600); color:#fff;
  box-shadow:0 4px 12px rgba(37,99,235,.35);
}

/* ============================= */
/* 4. MAIN / FEED                 */
/* ============================= */
main{
  padding-top:calc(var(--header-h) + 16px);
  padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));
  min-height:100vh;
  max-width:1200px; margin:0 auto;
}
#profileView, #detailView{
  padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));
}
.feed-grid{
  display:grid; grid-template-columns:repeat(2, 1fr); gap:14px; padding:0 14px;
}
@media (min-width:640px){ .feed-grid{grid-template-columns:repeat(3, 1fr);} }
@media (min-width:960px){ .feed-grid{grid-template-columns:repeat(4, 1fr); gap:18px; padding:0 20px;} }

.card{
  background:var(--card); border-radius:var(--radius-lg); overflow:hidden;
  border:1px solid var(--line); box-shadow:var(--shadow-sm);
  display:flex; flex-direction:column;
  animation:cardIn .35s ease both;
}
@keyframes cardIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
.card-img-wrap{
  position:relative; width:100%; aspect-ratio:1/1; background:var(--bg); overflow:hidden; cursor:pointer;
}
.card-img-wrap img{width:100%; height:100%; object-fit:cover; transition:transform .3s ease;}
.card-img-wrap:active img{transform:scale(1.04);}
.card-photocount{
  position:absolute; bottom:6px; right:6px; background:rgba(15,23,42,.65); color:#fff;
  font-size:.65rem; font-weight:700; padding:2px 7px; border-radius:999px; backdrop-filter:blur(4px);
}
.card-body{padding:10px 12px 12px; display:flex; flex-direction:column; gap:5px; flex:1;}
.card-price{
  display:inline-block; align-self:flex-start;
  background:var(--green-600); color:#fff; font-weight:800; font-size:.92rem;
  padding:3px 10px; border-radius:var(--radius-sm);
}
.card-title{
  font-size:.86rem; font-weight:700; color:var(--ink); line-height:1.3;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  min-height:2.6em;
}
.card-desc{
  font-size:.76rem; color:var(--ink-soft); line-height:1.35;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  min-height:2.7em;
}
.card-loc{
  font-size:.72rem; color:var(--ink-faint); display:flex; align-items:center; gap:3px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.card-actions{display:flex; gap:6px; margin-top:auto; padding-top:4px;}
.card-actions button{
  flex:1; display:flex; align-items:center; justify-content:center; gap:4px;
  padding:7px 4px; border-radius:var(--radius-sm); border:none; font-size:.72rem; font-weight:700;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.btn-whatsapp{background:var(--green-600); color:#fff;}
.btn-call{background:var(--blue-50); color:var(--blue-600); border:1px solid var(--blue-500) !important;}

.empty-state, .load-error{
  grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--ink-soft);
}
.empty-state svg{opacity:.4; margin-bottom:14px;}
.empty-state h3{margin:0 0 6px; font-size:1.05rem; color:var(--ink);}
.empty-state p{margin:0; font-size:.88rem;}

.skeleton{
  background:linear-gradient(100deg, var(--line) 30%, var(--bg) 50%, var(--line) 70%);
  background-size:200% 100%; animation:shimmer 1.3s infinite;
  border-radius:var(--radius-lg); aspect-ratio:.72;
}
@keyframes shimmer{ from{background-position:150% 0;} to{background-position:-50% 0;} }

/* Fixed, corner-tucked Load More button. Independent of feed scroll
   position (position:fixed), shown/hidden via the .hidden utility rather
   than being inserted/removed from the grid. Styled with the app's
   primary blue/slate gradient so it reads as a native, on-brand
   component rather than a stark black block. */
.btn-loadmore-fixed{
  position:fixed;
  right:0;
  bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom));
  z-index:450;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 16px 12px 20px;
  background:linear-gradient(135deg, #1e293b 0%, var(--blue-600) 55%, var(--blue-500) 100%);
  color:#ffffff;
  font-weight:700; font-size:.86rem; font-family:inherit;
  border:1px solid rgba(255,255,255,.35);
  border-right:none;
  border-radius:999px 0 0 999px;
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.28),
    inset 0 -2px 0 rgba(15,23,42,.35),
    0 4px 12px rgba(37,99,235,.28),
    0 14px 26px rgba(15,23,42,.28);
  transition:transform .12s ease, box-shadow .12s ease, opacity .15s ease;
  cursor:pointer;
}
.btn-loadmore-fixed:active{
  transform:translateX(3px) translateY(2px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),
    inset 0 -1px 0 rgba(15,23,42,.35),
    0 2px 8px rgba(37,99,235,.25);
}
.btn-loadmore-fixed:disabled{ opacity:.85; cursor:default; }
.loadmore-spinner-dark{
  width:15px; height:15px; border-radius:50%; flex-shrink:0;
  border:2px solid rgba(255,255,255,.35); border-top-color:#ffffff;
  animation:spin .7s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ============================= */
/* 5. BOTTOM NAV                  */
/* ============================= */
nav#bottomNav{
  position:fixed; bottom:calc(14px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); z-index:500;
  width:min(94%, 420px);
  background:var(--card); border:1px solid var(--line);
  border-radius:24px; box-shadow:var(--shadow-lg);
  display:flex; align-items:center; justify-content:space-around; padding:8px 10px;
  backdrop-filter:blur(14px);
}
.nav-item{
  display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none;
  color:var(--ink-faint); font-size:.68rem; font-weight:700; padding:6px 14px; border-radius:14px;
  transition:color .15s ease, background .15s ease;
}
.nav-item.active{color:var(--blue-600); background:var(--blue-50);}
.nav-sell{
  width:54px; height:54px; border-radius:50%; margin-top:-30px;
  background:linear-gradient(145deg, var(--blue-500), var(--blue-600));
  color:#fff; display:flex; align-items:center; justify-content:center;
  box-shadow:0 10px 22px rgba(37,99,235,.45); font-size:0;
  transition:transform .15s ease;
}
.nav-sell:active{transform:scale(.9);}

/* ============================= */
/* 6. MODALS                      */
/* ============================= */
.modal-overlay{
  position:fixed; inset:0; z-index:2000; background:rgba(15,23,42,.55); backdrop-filter:blur(3px);
  display:flex; align-items:flex-end; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .25s ease;
}
.modal-overlay.open{opacity:1; pointer-events:auto;}
@media (min-width:640px){ .modal-overlay{align-items:center;} }
.modal-sheet{
  background:var(--card); width:100%; max-width:560px; max-height:92vh; overflow-y:auto;
  border-radius:22px 22px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(40px); transition:transform .3s cubic-bezier(.32,.72,0,1);
  box-shadow:var(--shadow-lg);
}
.modal-overlay.open .modal-sheet{transform:translateY(0);}
@media (min-width:640px){ .modal-sheet{border-radius:22px; margin:20px;} }
.modal-handle{width:40px; height:4px; background:var(--line); border-radius:4px; margin:0 auto 14px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-head h2{margin:0; font-size:1.2rem; font-weight:800;}
.modal-close{width:34px; height:34px; border-radius:50%; border:none; background:var(--bg); color:var(--ink-soft); display:flex; align-items:center; justify-content:center;}

/* Auth modal */
.auth-illustration{
  width:84px; height:84px; margin:6px auto 18px; border-radius:24px;
  background:linear-gradient(145deg, var(--blue-500), var(--blue-600));
  display:flex; align-items:center; justify-content:center; color:#fff;
  box-shadow:0 14px 30px rgba(37,99,235,.35);
}
.auth-copy{text-align:center; color:var(--ink-soft); font-size:.9rem; margin-bottom:22px; line-height:1.5;}
.btn-google{
  width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
  padding:13px; border-radius:var(--radius-md); border:1.5px solid var(--line); background:var(--card);
  color:var(--ink); font-weight:700; font-size:.92rem; box-shadow:var(--shadow-sm);
}
.btn-google:active{transform:scale(.98);}

/* Sell modal form */
.form-group{margin-bottom:16px;}
.form-group label{display:block; font-size:.8rem; font-weight:700; color:var(--ink-soft); margin-bottom:6px;}
.form-group input, .form-group textarea, .form-group select{
  width:100%; padding:12px 14px; border-radius:var(--radius-md); border:1.5px solid var(--line);
  background:var(--bg); color:var(--ink); font-family:inherit; font-size:.92rem; outline:none;
}
.form-group input:focus, .form-group textarea:focus, .form-group select:focus{border-color:var(--blue-500); box-shadow:0 0 0 4px var(--blue-50);}
.form-group textarea{resize:vertical; min-height:80px;}
.form-row{display:flex; gap:12px;}
.form-row .form-group{flex:1;}
.img-upload-row{display:flex; gap:10px; flex-wrap:wrap;}
.img-thumb{position:relative; width:76px; height:76px; border-radius:var(--radius-sm); overflow:hidden; border:1px solid var(--line);}
.img-thumb img{width:100%; height:100%; object-fit:cover;}
.img-thumb .img-del{
  position:absolute; top:2px; right:2px; width:20px; height:20px; border-radius:50%; border:none;
  background:rgba(15,23,42,.75); color:#fff; font-size:.7rem; display:flex; align-items:center; justify-content:center;
}
.img-add-btn{
  width:76px; height:76px; border-radius:var(--radius-sm); border:2px dashed var(--line);
  background:var(--bg); color:var(--ink-faint); display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:.65rem; gap:2px; font-weight:700;
}
.upload-progress{font-size:.72rem; color:var(--blue-600); margin-top:4px;}
.btn-submit{
  width:100%; padding:14px; border-radius:var(--radius-md); border:none; margin-top:6px;
  background:linear-gradient(135deg, var(--blue-500), var(--blue-600)); color:#fff; font-weight:800; font-size:.95rem;
  box-shadow:0 10px 22px rgba(37,99,235,.35);
}
.btn-submit:disabled{opacity:.6;}

/* Menu drawer */
.drawer-overlay{
  position:fixed; inset:0; z-index:2000; background:rgba(15,23,42,.5);
  opacity:0; pointer-events:none; transition:opacity .25s ease;
}
.drawer-overlay.open{opacity:1; pointer-events:auto;}
.drawer{
  position:fixed; top:0; left:0; bottom:0; width:78%; max-width:300px; background:var(--card); z-index:2001;
  transform:translateX(-105%); transition:transform .3s cubic-bezier(.32,.72,0,1);
  padding:20px; box-shadow:var(--shadow-lg); display:flex; flex-direction:column; gap:4px;
}
.drawer.open{transform:translateX(0);}
.drawer-title{font-size:1.2rem; font-weight:800; color:var(--blue-600); margin-bottom:16px;}
.drawer-item{
  display:flex; align-items:center; gap:12px; padding:12px 10px; border-radius:var(--radius-sm);
  color:var(--ink); font-weight:600; font-size:.9rem; background:none; border:none; width:100%; text-align:left;
}
.drawer-item:active{background:var(--bg);}
.drawer-sep{height:1px; background:var(--line); margin:10px 0;}
.lang-toggle, .theme-toggle{
  display:flex; align-items:center; justify-content:space-between; padding:10px; border-radius:var(--radius-md); background:var(--bg);
}
.switch-track{
  width:46px; height:26px; border-radius:999px; background:var(--line); position:relative; border:none;
}
.switch-track::after{
  content:""; position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .2s ease;
}
.switch-track.on{background:var(--blue-600);}
.switch-track.on::after{transform:translateX(20px);}
.lang-pill-group{display:flex; background:var(--bg); border-radius:999px; padding:3px; gap:2px;}
.lang-pill-group button{padding:5px 12px; border-radius:999px; border:none; background:none; font-size:.76rem; font-weight:700; color:var(--ink-soft);}
.lang-pill-group button.active{background:var(--blue-600); color:#fff;}

/* Profile view */
.profile-header{
  display:flex; align-items:center; gap:14px; padding:20px 18px; background:var(--card); margin:0 14px 16px;
  border-radius:var(--radius-lg); border:1px solid var(--line); box-shadow:var(--shadow-sm);
}
.profile-avatar{width:64px; height:64px; border-radius:50%; object-fit:cover; border:2px solid var(--blue-500);}
.profile-avatar-fallback{
  width:64px; height:64px; border-radius:50%; background:var(--blue-50); color:var(--blue-600);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.4rem;
}
.profile-name{font-size:1.05rem; font-weight:800;}
.profile-email{font-size:.8rem; color:var(--ink-soft);}
.profile-signout{margin-top:8px; font-size:.76rem; color:#dc2626; font-weight:700; background:none; border:none; padding:0;}
.section-heading{padding:0 14px; font-size:1rem; font-weight:800; margin:6px 0 10px;}
.myproduct-card{
  display:flex; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md);
  padding:10px; margin:0 14px 10px;
}
.myproduct-card img{width:72px; height:72px; border-radius:var(--radius-sm); object-fit:cover; flex-shrink:0;}
.myproduct-info{flex:1; min-width:0;}
.myproduct-title{font-weight:700; font-size:.86rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.myproduct-price{color:var(--green-600); font-weight:800; font-size:.85rem;}
.myproduct-del{
  align-self:center; width:36px; height:36px; border-radius:50%; border:none; background:#fef2f2; color:#dc2626; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.guest-card{
  margin:0 14px 16px; padding:26px 20px; text-align:center; background:var(--card); border:1px solid var(--line);
  border-radius:var(--radius-lg); box-shadow:var(--shadow-sm);
}
.guest-card h3{margin:10px 0 6px;}
.guest-card p{color:var(--ink-soft); font-size:.87rem; margin:0 0 16px;}
.btn-primary-pill{
  padding:11px 26px; border-radius:999px; border:none; background:var(--blue-600); color:#fff; font-weight:700; font-size:.88rem;
}

/* Lightbox */
.lightbox{
  position:fixed; inset:0; z-index:3000; background:rgba(0,0,0,.94);
  display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .25s ease;
  touch-action:none;
}
.lightbox.open{opacity:1; pointer-events:auto;}
.lightbox img{
  max-width:92vw; max-height:82vh; object-fit:contain; user-select:none; -webkit-user-drag:none;
  touch-action:none; will-change:transform;
}
.lightbox-close{
  position:absolute; top:18px; right:18px; width:40px; height:40px; border-radius:50%; border:none;
  background:rgba(255,255,255,.15); color:#fff; display:flex; align-items:center; justify-content:center; font-size:1.1rem;
}
.lightbox-nav{
  position:absolute; top:50%; transform:translateY(-50%); width:44px; height:44px; border-radius:50%;
  border:none; background:rgba(255,255,255,.15); color:#fff; display:flex; align-items:center; justify-content:center;
}
.lightbox-prev{left:14px;} .lightbox-next{right:14px;}
.lightbox-counter{position:absolute; bottom:22px; left:50%; transform:translateX(-50%); color:#fff; font-size:.8rem; background:rgba(255,255,255,.15); padding:4px 12px; border-radius:999px;}

/* Toast */
#toast{
  position:fixed; bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:#fff; padding:12px 20px; border-radius:999px; font-size:.85rem; font-weight:600;
  z-index:4000; opacity:0; pointer-events:none; transition:all .3s ease; box-shadow:var(--shadow-lg); max-width:88vw; text-align:center;
}
[data-theme="dark"] #toast{background:#1c2534;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* Detail view (product page inside SPA) */
.detail-wrap{padding:0 14px;}
.detail-gallery{display:flex; gap:8px; overflow-x:auto; border-radius:var(--radius-lg); margin-bottom:14px;}
.detail-gallery img{width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:var(--radius-lg); flex-shrink:0; scroll-snap-align:start; cursor:pointer;}
.detail-gallery{scroll-snap-type:x mandatory;}
.detail-price{font-size:1.5rem;}
.detail-title{font-size:1.15rem; font-weight:800; margin:10px 0 4px;}
.detail-meta{color:var(--ink-faint); font-size:.82rem; margin-bottom:14px;}
.detail-desc{font-size:.9rem; line-height:1.6; color:var(--ink-soft); margin-bottom:20px; white-space:pre-line;}
.detail-actions{display:flex; gap:10px; position:sticky; bottom:calc(var(--nav-h) + 24px);}
.detail-actions button{flex:1; padding:14px; border-radius:var(--radius-md); font-weight:800; font-size:.9rem; border:none;}
.back-btn{display:inline-flex; align-items:center; gap:6px; padding:10px 0; color:var(--blue-600); font-weight:700; font-size:.85rem; background:none; border:none;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

/* ==========================================
   FORCE HIDE BOTTOM ELEMENTS ON KEYBOARD FOCUS
   ========================================== */

/* जब भी किसी इनपुट या सर्च बॉक्स पर टैप/फोकस हो */
body:has(input:focus) .bottom-nav,
body:has(input:focus) [class*="bottom"],
body:has(input:focus) [class*="load-more"],
body:has(input:focus) button[class*="load"],
body:has(input:focus) .sticky,
body:has(input:focus) .fixed {
  display: none !important;
  visibility: hidden !important;
  opacity: 0 !important;
}
</style>
</head>

function applyI18n(){

/* Keeps --header-h in sync with the header's real rendered height so feed
   cards / titles never end up hidden underneath the fixed header — this
   stays correct even if Hindi text, long category names, or the nearby
   banner cause the header to wrap onto extra lines on narrow screens. */
function syncHeaderHeight(){
  const header = document.getElementById("appHeader");
  if(!header) return;
  const h = header.offsetHeight;
  if(h > 0){
    document.documentElement.style.setProperty("--header-h", h + "px");
  }
}
window.addEventListener("resize", syncHeaderHeight);
window.addEventListener("orientationchange", syncHeaderHeight);
if(window.ResizeObserver){
  const headerObserver = new ResizeObserver(()=> syncHeaderHeight());
  window.addEventListener("DOMContentLoaded", ()=>{
    const header = document.getElementById("appHeader");
    if(header) headerObserver.observe(header);
  });
}

/* The Search Bar and Category Pills are feed-browsing controls, so they
   only make sense on the Home feed itself — hide them on Profile, the
   Sell modal, and Product Detail, and restore them the moment the user
   is back browsing the feed. */
function syncHeaderChromeVisibility(){
  const sellModalEl = document.getElementById("sellModal");
  const isSellOpen = sellModalEl && sellModalEl.classList.contains("open");
  const hideChrome = currentView !== "home" || isSellOpen;
  const searchWrap = document.getElementById("searchWrap");
  const pills = document.getElementById("categoryPills");
  if(searchWrap) searchWrap.classList.toggle("hidden", hideChrome);
  if(pills) pills.classList.toggle("hidden", hideChrome);

function isValidPost(p){

/* ==========================================================
   LOCAL STORAGE CACHE (Stale-While-Revalidate)
   ========================================================== */
function readCache(){
  try{
    const raw = localStorage.getItem(LOCAL_CACHE_KEY);
    if(!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function writeCache(posts){
  try{
    const sorted = [...posts].sort((a,b)=>(b._ts||0)-(a._ts||0));
    const capped = sorted.slice(0, LOCAL_CACHE_CAP);
    localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(capped));
  }catch(e){ /* storage full or blocked - fail silently */ }
}
function mergeIntoCache(newPosts){
  const cache = readCache();
  const map = new Map(cache.map(p=>[p.id, p]));
  newPosts.forEach(p=> map.set(p.id, p));
  writeCache(Array.from(map.values()));
}
function removeFromCache(id){
  const cache = readCache().filter(p=>p.id !== id);
  writeCache(cache);
}

/* ==========================================================
   FIRESTORE HELPERS
   ========================================================== */
function docToPost(docSnap){
  const data = docSnap.data();
  const ts = data.createdAt && data.createdAt.toMillis ? data.createdAt.toMillis() : Date.now();
  return {
    id: docSnap.id,
    title: data.title || "",
    price: data.price || 0,
    description: data.description || "",
    location: data.location || "",
    phone: data.phone || "",
    category: data.category || "Home",
    images: Array.isArray(data.images) ? data.images : [],
    ownerUid: data.ownerUid || "",
    ownerName: data.ownerName || "",
    _ts: ts
  };
}

async function fetchInitialPosts(){
  const q = query(collection(db, POSTS_COLLECTION), orderBy("createdAt","desc"), limit(PAGE_SIZE_INITIAL));
  const snap = await getDocs(q);
  lastVisibleDoc = snap.docs.length ? snap.docs[snap.docs.length-1] : null;
  // "reachedEnd" is based on the RAW page size Firestore returned, not on
  // how many of those docs pass isValidPost() — a page that happens to be
  // full of malformed posts still means there may be more real posts ahead.
  const reachedEnd = snap.docs.length < PAGE_SIZE_INITIAL;
  const posts = snap.docs.map(docToPost).filter(isValidPost);
  return { posts, reachedEnd };
}

async function fetchMorePosts(){
  if(!lastVisibleDoc) return { posts: [], reachedEnd: true };
  const q = query(
    collection(db, POSTS_COLLECTION),
    orderBy("createdAt","desc"),
    startAfter(lastVisibleDoc),
    limit(PAGE_SIZE_MORE)
  );
  const snap = await getDocs(q);
  const reachedEnd = snap.docs.length < PAGE_SIZE_MORE;
  lastVisibleDoc = snap.docs.length ? snap.docs[snap.docs.length-1] : lastVisibleDoc;
  const posts = snap.docs.map(docToPost).filter(isValidPost);
  return { posts, reachedEnd };
}

async function fetchMyPosts(uid){
  const q = query(collection(db, POSTS_COLLECTION), where("ownerUid","==",uid), orderBy("createdAt","desc"), limit(100));
  const snap = await getDocs(q);
  return snap.docs.map(docToPost).filter(isValidPost);
}

  });
}

function updateNearbyBannerVisibility(filteredCount){
  const banner = document.getElementById("nearbyBanner");
  if(!banner) return;
  // Show for "All" unconditionally, or for a specific category only when
  // that category actually has products to display right now.
  const shouldShow = activeCategory === "All" || filteredCount > 0;
  banner.classList.toggle("hidden", !shouldShow);
}

/* Fixed corner Load More button — contextual visibility:
   - Hidden outright when the user isn't on the Home feed (Profile, Item
     Detail, or any other view).
   - On Home with category "All": always visible, regardless of how many
     posts are currently rendered (there's always potentially more to
     fetch from Firestore).
   - On Home with any other category filter: visible only while that
     filtered view actually has product cards on screen — hidden the
     instant it shows "No items found" / 0 cards. */
function updateLoadMoreVisibility(filteredCount){
  const btn = document.getElementById("loadMoreBtn");
  if(!btn) return;
  if(currentView !== "home"){
    btn.classList.add("hidden");
    return;
  }
  const count = filteredCount != null ? filteredCount : getFilteredPosts().length;
  const shouldShow = activeCategory === "All" || count > 0;
  btn.classList.toggle("hidden", !shouldShow);
}

function renderFeed(append=false){
  const grid = document.getElementById("feedGrid");
  const posts = getFilteredPosts();
  updateNearbyBannerVisibility(posts.length);
  updateLoadMoreVisibility(posts.length);

  if(!append){
    if(posts.length===0){
      grid.innerHTML = `
      <div class="empty-state">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <h3>${t("noResults")}</h3>
        <p>${t("noResultsSub")}</p>
      </div>`;
      return;
    }
    grid.innerHTML = posts.map(cardTemplate).join("");
  } else {
    const existingIds = new Set(Array.from(grid.querySelectorAll(".card")).map(el=>el.dataset.id));
    const newHtml = posts.filter(p=>!existingIds.has(p.id)).map(cardTemplate).join("");
    grid.insertAdjacentHTML("beforeend", newHtml);
  }
}

function setLoadMoreLoading(btn, isLoading){
  const spinner = document.getElementById("loadMoreSpinner");
  const label = document.getElementById("loadMoreLabel");
  btn.disabled = isLoading;
  if(spinner) spinner.classList.toggle("hidden", !isLoading);
  if(label) label.textContent = isLoading ? t("loading") : t("loadMore");
}

async function handleLoadMore(){
  const btn = document.getElementById("loadMoreBtn");
  if(!btn || btn.disabled) return;
  setLoadMoreLoading(btn, true);
  try{
    // Fetch the next 20 products and give the spinner a smooth, deliberate
    // minimum ~2s so it never feels like a flicker, even on a fast network.
    const [result] = await Promise.all([ fetchMorePosts(), sleep(2000) ]);
    noMorePosts = result.reachedEnd;

    if(result.posts.length){
      const ids = new Set(allPosts.map(p=>p.id));
      const fresh = result.posts.filter(p=>!ids.has(p.id));
      allPosts = [...allPosts, ...fresh];
      mergeIntoCache(fresh); // merges + re-applies the 200-post cache cap
      renderFeed(true);
    } else {
      // Zero new posts came back — Firestore has nothing further to give
      // us right now. Say so, but the button itself always stays visible
      // so the user is never blocked from trying again later.
      showToast(t("toastNoMoreProducts"));
    }
  }catch(e){
    console.error(e);
    showToast(t("toastError"));
  }finally{
    // Always runs — success, empty page, or a thrown error — so the
    // spinner can never get stuck on and the button state stays correct.
    setLoadMoreLoading(btn, false);
    updateLoadMoreVisibility();
  }
}
document.getElementById("loadMoreBtn").addEventListener("click", handleLoadMore);

/* ==========================================================
   INIT FEED: cache-first, then network
   ========================================================== */
async function initFeed(){
  const cached = readCache();
  if(cached.length){
    allPosts = cached.filter(isValidPost);
    renderFeed(false);
  } else {
    renderSkeletons(8);
  }

  try{
    const { posts: fresh, reachedEnd } = await fetchInitialPosts();
    allPosts = fresh;
    noMorePosts = reachedEnd;
    writeCache(fresh);
    renderFeed(false);
  }catch(e){
    console.error("Firestore fetch failed:", e);
    if(!cached.length){
      document.getElementById("feedGrid").innerHTML = `
      <div class="load-error">
        <p>${t("toastError")}</p>
      </div>`;
    }
  }
}

/* ==========================================================
   LIGHTBOX
   ========================================================== */
function openLightboxForPost(id){
  const post = allPosts.find(p=>p.id===id) || getAllKnownPosts().find(p=>p.id===id);
  if(!post) return;
  lightboxImages = post.images;
  lightboxIndex = 0;
  updateLightbox();
  document.getElementById("lightbox").classList.add("open");
}
function getAllKnownPosts(){
  return [...allPosts, ...readCache()];
}
function updateLightbox(){
  // Reset zoom/pan whenever the displayed image changes.
  lbScale = 1; lbPanX = 0; lbPanY = 0;
  applyLightboxTransform();
  document.getElementById("lightboxImg").src = lightboxImages[lightboxIndex];
  document.getElementById("lightboxCounter").textContent = `${lightboxIndex+1} / ${lightboxImages.length}`;
  document.getElementById("lightboxPrev").style.display = lightboxImages.length>1 ? "flex":"none";
  document.getElementById("lightboxNext").style.display = lightboxImages.length>1 ? "flex":"none";
}
function closeLightbox(){
  lbScale = 1; lbPanX = 0; lbPanY = 0;
  applyLightboxTransform();
  document.getElementById("lightbox").classList.remove("open");
}
document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
document.getElementById("lightboxPrev").addEventListener("click", ()=>{
  lightboxIndex = (lightboxIndex - 1 + lightboxImages.length) % lightboxImages.length;
  updateLightbox();
});
document.getElementById("lightboxNext").addEventListener("click", ()=>{
  lightboxIndex = (lightboxIndex + 1) % lightboxImages.length;
  updateLightbox();
});

/* --------------------------------------------------------
   Lightbox gestures: pinch-to-zoom + full 4-directional pan
   (left/right/up/down) while zoomed, plus swipe-to-navigate
   and double-tap-to-zoom when at 1x.
   -------------------------------------------------------- */
const lbEl = document.getElementById("lightbox");
const lbImgEl = document.getElementById("lightboxImg");
let lbScale = 1, lbPanX = 0, lbPanY = 0;
const LB_MIN_SCALE = 1, LB_MAX_SCALE = 4;

let lbMode = null;               // 'pinch' | 'pan' | 'swipe'
let lbLastPinchDist = null;
let lbLastPanPoint = null;
let lbSwipeStartX = 0, lbSwipeStartY = 0;
let lbTapStartX = 0, lbTapStartY = 0, lbTapStartTime = 0;
let lbLastTapTime = 0;

function applyLightboxTransform(animated){
  lbImgEl.style.transition = animated ? "transform .2s ease" : "none";
  lbImgEl.style.transform = `translate(${lbPanX}px, ${lbPanY}px) scale(${lbScale})`;
  if(animated){
    setTimeout(()=>{ lbImgEl.style.transition = "none"; }, 220);
  }
}
function clampPan(){
  // Keep the pan within a sensible range that grows with zoom level so the
  // image can be dragged in all four directions without flying off-screen.
  const maxOffset = (lbScale - 1) * (lbImgEl.clientWidth || 300) * 0.6;
  lbPanX = Math.max(-maxOffset, Math.min(maxOffset, lbPanX));
  lbPanY = Math.max(-maxOffset, Math.min(maxOffset, lbPanY));
}

lbEl.addEventListener("touchstart",(e)=>{
  if(e.touches.length===2){
    lbMode = "pinch";
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    lbLastPinchDist = Math.hypot(dx,dy);
  } else if(e.touches.length===1){
    lbTapStartX = e.touches[0].clientX;
    lbTapStartY = e.touches[0].clientY;
    lbTapStartTime = Date.now();
    if(lbScale > 1.01){
      lbMode = "pan";
      lbLastPanPoint = {x:e.touches[0].clientX, y:e.touches[0].clientY};
    } else {
      lbMode = "swipe";
      lbSwipeStartX = e.touches[0].clientX;
      lbSwipeStartY = e.touches[0].clientY;
    }
  }
}, {passive:true});

lbEl.addEventListener("touchmove",(e)=>{
  if(lbMode==="pinch" && e.touches.length===2){
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx,dy);
    if(lbLastPinchDist != null){
      lbScale = Math.min(LB_MAX_SCALE, Math.max(LB_MIN_SCALE, lbScale * (dist / lbLastPinchDist)));
      clampPan();
      applyLightboxTransform();
    }
    lbLastPinchDist = dist;
  } else if(lbMode==="pan" && e.touches.length===1){
    e.preventDefault();
    const dx = e.touches[0].clientX - lbLastPanPoint.x;
    const dy = e.touches[0].clientY - lbLastPanPoint.y;
    lbPanX += dx;
    lbPanY += dy;
    clampPan();
    lbLastPanPoint = {x:e.touches[0].clientX, y:e.touches[0].clientY};
    applyLightboxTransform();
  }
  // 'swipe' mode: resolved on touchend (navigation only happens at 1x zoom).
}, {passive:false});

lbEl.addEventListener("touchend",(e)=>{
  if(lbMode==="swipe" && lbScale <= 1.01){
    const touch = e.changedTouches[0];
    const dx = touch.clientX - lbSwipeStartX;
    const dy = touch.clientY - lbSwipeStartY;
    const elapsed = Date.now() - lbTapStartTime;
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) && lightboxImages.length>1){
      if(dx > 0) lightboxIndex = (lightboxIndex - 1 + lightboxImages.length) % lightboxImages.length;
      else lightboxIndex = (lightboxIndex + 1) % lightboxImages.length;
      updateLightbox();
    } else if(Math.abs(dx) < 12 && Math.abs(dy) < 12 && elapsed < 300){
      // Tap (not a swipe) — check for double-tap to zoom.
      const now = Date.now();
      if(now - lbLastTapTime < 320){
        if(lbScale > 1.01){
          lbScale = 1; lbPanX = 0; lbPanY = 0;
        } else {
          lbScale = 2.4;
        }
        applyLightboxTransform(true);
        lbLastTapTime = 0;
      } else {
        lbLastTapTime = now;
      }
    }
  }

  if(e.touches.length===0){
    lbMode = null;
    lbLastPinchDist = null;
    lbLastPanPoint = null;
    if(lbScale < 1.02){ lbScale = 1; lbPanX = 0; lbPanY = 0; applyLightboxTransform(); }
  } else if(e.touches.length===1){
    // Transitioned from a two-finger pinch down to one finger.
    if(lbScale > 1.01){
      lbMode = "pan";
      lbLastPanPoint = {x:e.touches[0].clientX, y:e.touches[0].clientY};
    } else {
      lbMode = "swipe";
      lbSwipeStartX = e.touches[0].clientX;
      lbSwipeStartY = e.touches[0].clientY;
    }
  }
}, {passive:true});

lbEl.addEventListener("click",(e)=>{
  if(e.target.id==="lightbox"){
    closeLightbox();
  }
});

function openDetailView(id){
  const post = getAllKnownPosts().find(p=>p.id===id);
  if(!post) return;
  currentView = "detail";
  syncHeaderChromeVisibility();
  updateLoadMoreVisibility();
  document.getElementById("mainContent").classList.add("hidden");
  document.getElementById("profileView").classList.add("hidden");
  const detailView = document.getElementById("detailView");
  detailView.classList.remove("hidden");
  const waNumber = "91" + sanitizePhone(post.phone);
  const waMsg = encodeURIComponent(`Hi, I'm interested in your listing "${post.title}" on ReShop India.`);
  detailView.innerHTML = `
    <div class="detail-wrap" style="padding-top:calc(var(--header-h) + 4px);">
      <button class="back-btn" id="detailBack">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${t("back")}
      </button>
      <div class="detail-gallery">
        ${post.images.map((img,i)=>`<img src="${escapeHtml(img)}" alt="${escapeHtml(post.title)}" data-action="detail-lightbox" data-idx="${i}">`).join("")}
      </div>
      <span class="card-price detail-price">${formatPrice(post.price)}</span>
      <div class="detail-title">${escapeHtml(post.title)}</div>
      <div class="detail-meta">📍 ${escapeHtml(post.location)} &nbsp;•&nbsp; ${post.images.length} ${t("photosLbl")}</div>
      <div class="detail-desc">${escapeHtml(post.description)}</div>
    </div>
    <div class="detail-wrap detail-actions">
      <button class="btn-whatsapp" id="detailWa">${t("whatsapp")}</button>
      <button class="btn-call" style="border:1.5px solid var(--blue-500);" id="detailCall">${t("call")}</button>
    </div>
  `;
  document.getElementById("detailBack").addEventListener("click", ()=>closeDetailView());
  document.getElementById("detailWa").addEventListener("click", ()=>window.open(`https://wa.me/${waNumber}?text=${waMsg}`,"_blank"));
  document.getElementById("detailCall").addEventListener("click", ()=>window.location.href=`tel:${sanitizePhone(post.phone)}`);
  detailView.querySelectorAll('[data-action="detail-lightbox"]').forEach(imgEl=>{
    imgEl.addEventListener("click", ()=>{
      lightboxImages = post.images;
      lightboxIndex = Number(imgEl.dataset.idx);
      updateLightbox();
      document.getElementById("lightbox").classList.add("open");
    });
  });
  window.scrollTo(0,0);
  setActiveNav(null);
}
function closeDetailView(){
  currentView = "home";
  syncHeaderChromeVisibility();
  updateLoadMoreVisibility();
  document.getElementById("detailView").classList.add("hidden");
  document.getElementById("mainContent").classList.remove("hidden");
  setActiveNav("home");
}

});

function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem("reshop_theme", theme);
  document.getElementById("themeSwitch").classList.toggle("on", theme==="dark");

  const sun = document.getElementById("themeIconSun");
  const moon = document.getElementById("themeIconMoon");
  if(sun && moon){
    const isDark = theme==="dark";
    sun.classList.toggle("hidden", isDark);
    moon.classList.toggle("hidden", !isDark);
    const visibleIcon = isDark ? moon : sun;
    // Restart the pop-in animation even if it was already applied once.
    visibleIcon.classList.remove("pop");
    void visibleIcon.offsetWidth;
    visibleIcon.classList.add("pop");
  }
}
document.getElementById("themeSwitch").addEventListener("click", ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  applyTheme(cur==="dark" ? "light" : "dark");
});
document.getElementById("themeQuickBtn").addEventListener("click", ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  applyTheme(cur==="dark" ? "light" : "dark");
});

function setActiveNav(view){
  document.querySelectorAll(".nav-item").forEach(el=>el.classList.remove("active"));
  if(view==="home") document.getElementById("navHome").classList.add("active");
  if(view==="profile") document.getElementById("navProfile").classList.add("active");
}
function switchView(view){
  currentView = view;
  syncHeaderChromeVisibility();
  updateLoadMoreVisibility();
  document.getElementById("mainContent").classList.toggle("hidden", view!=="home");
  document.getElementById("profileView").classList.toggle("hidden", view!=="profile");
  document.getElementById("detailView").classList.add("hidden");
  setActiveNav(view);
  if(view==="profile") renderProfileView();
  window.scrollTo(0,0);
}
document.getElementById("navHome").addEventListener("click", ()=>switchView("home"));
document.getElementById("navProfile").addEventListener("click", ()=>switchView("profile"));

/* ==========================================================
   AUTH GUARD + SELL FLOW
   ========================================================== */
const authModal = document.getElementById("authModal");
const sellModal = document.getElementById("sellModal");
const signOutModal = document.getElementById("signOutModal");

function openModal(el){ el.classList.add("open"); syncHeaderChromeVisibility(); }
function closeModal(el){
  el.classList.remove("open");
  if(el === sellModal){
    // A genuine user-driven close (✕ button, backdrop tap) — as opposed to
    // the tab merely backgrounding for a camera capture, which never runs
    // this — means they're abandoning the draft, so drop it.
    clearSellDraft();
  }
  syncHeaderChromeVisibility();
}

document.querySelectorAll("[data-close]").forEach(btn=>{
  btn.addEventListener("click", ()=> closeModal(document.getElementById(btn.dataset.close)) );
});
[authModal, sellModal, signOutModal].forEach(modal=>{
  modal.addEventListener("click",(e)=>{ if(e.target===modal) closeModal(modal); });
});

document.getElementById("signOutCancelBtn").addEventListener("click", ()=> closeModal(signOutModal));
document.getElementById("signOutConfirmBtn").addEventListener("click", async ()=>{
  closeModal(signOutModal);
  try{
    await signOut(auth);
    showToast(t("toastSignedOut"));
    switchView("home");
  }catch(e){
    console.error(e);
    showToast(t("toastError"));
  }
});

function handleSellClick(){
  if(currentUser){
    openSellModal();
  } else {
    pendingSellOpen = true;
    openModal(authModal);
  }
}

document.getElementById("googleSignInBtn").addEventListener("click", async ()=>{
  try{
    // Persist intent across the full-page redirect (mobile browsers block
    // signInWithPopup, so we navigate away and come back via getRedirectResult).
    localStorage.setItem(PENDING_SELL_KEY, pendingSellOpen ? "1" : "0");
    pendingSellOpen = false;
    await signInWithRedirect(auth, googleProvider);
    // Execution stops here — the browser navigates to Google and back.
  }catch(e){
    console.error(e);
    localStorage.removeItem(PENDING_SELL_KEY);
    showToast(t("toastError"));
  }
});

// Captures the login credentials once Google redirects back to the app.
async function handleRedirectResult(){
  try{
    const result = await getRedirectResult(auth);
    if(result && result.user){
      closeModal(authModal);
      showToast(t("toastSignedIn"));
      if(localStorage.getItem(PENDING_SELL_KEY) === "1"){
        localStorage.removeItem(PENDING_SELL_KEY);
        // Give onAuthStateChanged/currentUser a tick to settle, then open Sell modal.
        setTimeout(()=> openSellModal(), 50);
      } else {
        localStorage.removeItem(PENDING_SELL_KEY);
      }
    }
  }catch(e){
    console.error("Redirect sign-in error:", e);
    localStorage.removeItem(PENDING_SELL_KEY);
    showToast(t("toastError"));
  }
}

onAuthStateChanged(auth, (user)=>{
  currentUser = user;
  if(currentView==="profile") renderProfileView();
});

/* ==========================================================
   SELL MODAL: image upload + submit
   ========================================================== */
const imgUploadRow = document.getElementById("imgUploadRow");
const imgAddBtn = document.getElementById("imgAddBtn");
const imgFileInput = document.getElementById("imgFileInput");
const uploadProgress = document.getElementById("uploadProgress");
const sellForm = document.getElementById("sellForm");
const sellSubmitBtn = document.getElementById("sellSubmitBtn");

const MAX_PHOTOS = 3;
const MAX_PHOTO_BYTES = 10 * 1024 * 1024; // 10MB
const SELL_DRAFT_KEY = "reshop_sell_draft";

function openSellModal(opts){
  const preserveDraft = opts && opts.preserveDraft;
  if(!preserveDraft){
    sellForm.reset();
    selectedFiles.forEach(f=>{ if(f.localUrl) URL.revokeObjectURL(f.localUrl); });
    selectedFiles = [];
    renderImgThumbs();
  }
  openModal(sellModal);
}

/* --------------------------------------------------------
   Camera-capture state preservation.
   Opening the native camera from a file input can cause some mobile
   browsers to reclaim memory and silently reload the page/tab once the
   user returns — which would normally wipe out whatever they'd already
   typed and any photos already added. To survive that, we continuously
   snapshot the Sell form (fields + photos, photos as data URLs so the
   actual File objects can be rebuilt) into sessionStorage, and restore
   it automatically on the next load if a draft is found.
   -------------------------------------------------------- */
function fileToDataURL(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function dataURLToFile(dataUrl, filename, mimeType){
  const parts = dataUrl.split(",");
  const mimeMatch = parts[0].match(/:(.*?);/);
  const mime = mimeType || (mimeMatch ? mimeMatch[1] : "image/jpeg");
  const bstr = atob(parts[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  while(n--){ u8arr[n] = bstr.charCodeAt(n); }
  return new File([u8arr], filename || "photo.jpg", { type: mime });
}
function debounce(fn, wait){
  let timer = null;
  return (...args)=>{
    clearTimeout(timer);
    timer = setTimeout(()=> fn(...args), wait);
  };
}

async function persistSellDraft(){
  if(!sellModal.classList.contains("open")) return;
  const draft = {
    modalOpen: true,
    title: document.getElementById("fTitle").value,
    price: document.getElementById("fPrice").value,
    category: document.getElementById("fCategory").value,
    description: document.getElementById("fDesc").value,
    location: document.getElementById("fLocation").value,
    phone: document.getElementById("fPhone").value,
    images: []
  };
  try{
    draft.images = await Promise.all(selectedFiles.map(async f=>({
      name: f.file.name || "photo.jpg",
      type: f.file.type || "image/jpeg",
      dataUrl: await fileToDataURL(f.file)
    })));
    sessionStorage.setItem(SELL_DRAFT_KEY, JSON.stringify(draft));
  }catch(e){
    // Likely a storage-quota issue with large camera photos — fall back to
    // preserving just the typed fields so nothing is lost outright.
    try{
      draft.images = [];
      sessionStorage.setItem(SELL_DRAFT_KEY, JSON.stringify(draft));
    }catch(_){ /* give up silently — best-effort only */ }
  }
}
const persistSellDraftDebounced = debounce(persistSellDraft, 400);

function clearSellDraft(){
  try{ sessionStorage.removeItem(SELL_DRAFT_KEY); }catch(e){ /* ignore */ }
}

async function restoreSellDraftIfAny(){
  let raw;
  try{ raw = sessionStorage.getItem(SELL_DRAFT_KEY); }catch(e){ return; }
  if(!raw) return;
  let draft;
  try{ draft = JSON.parse(raw); }catch(e){ clearSellDraft(); return; }
  if(!draft || !draft.modalOpen) return;

  selectedFiles = [];
  (draft.images || []).forEach(img=>{
    try{
      const file = dataURLToFile(img.dataUrl, img.name, img.type);
      const localUrl = URL.createObjectURL(file);
      selectedFiles.push({file, localUrl});
    }catch(e){ /* skip a corrupted entry, keep the rest */ }
  });

  openSellModal({preserveDraft:true});
  document.getElementById("fTitle").value = draft.title || "";
  document.getElementById("fPrice").value = draft.price || "";
  document.getElementById("fCategory").value = draft.category || "Home";
  document.getElementById("fDesc").value = draft.description || "";
  document.getElementById("fLocation").value = draft.location || "";
  document.getElementById("fPhone").value = draft.phone || "";
  renderImgThumbs();
  showToast(t("toastDraftRestored"));
}
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden) persistSellDraft();
});

imgAddBtn.addEventListener("click", ()=> imgFileInput.click());
imgFileInput.addEventListener("change", (e)=>{
  const files = Array.from(e.target.files || []);
  if(files.length === 0) return;

  // Validate each picked file before it ever touches selectedFiles, so the
  // array stays a true reflection of what's actually valid and previewable.
  const validFiles = [];
  let hadInvalidType = false;
  let hadTooLarge = false;
  files.forEach(file=>{
    if(!file.type || !file.type.startsWith("image/")){
      hadInvalidType = true;
      return;
    }
    if(file.size > MAX_PHOTO_BYTES){
      hadTooLarge = true;
      return;
    }
    validFiles.push(file);
  });
  if(hadInvalidType) showToast(t("toastInvalidPhoto"));
  if(hadTooLarge) showToast(t("toastPhotoTooLarge"));

  const room = Math.max(0, MAX_PHOTOS - selectedFiles.length);
  if(validFiles.length > room){
    showToast(t("toastMaxPhotos"));
  }
  validFiles.slice(0, room).forEach(file=>{
    const localUrl = URL.createObjectURL(file);
    selectedFiles.push({file, localUrl});
  });
  renderImgThumbs();
  imgFileInput.value = ""; // allow re-selecting the same file later
  persistSellDraft(); // snapshot immediately — a camera capture may background the tab next
});

function renderImgThumbs(){
  const thumbs = selectedFiles.map((f, idx)=>`
    <div class="img-thumb" data-idx="${idx}">
      <img src="${f.localUrl}" alt="preview ${idx+1}">
      <button type="button" class="img-del" data-del="${idx}" aria-label="Remove photo">✕</button>
    </div>
  `).join("");
  imgUploadRow.innerHTML = thumbs + (selectedFiles.length < MAX_PHOTOS ? `
    <button type="button" class="img-add-btn" id="imgAddBtn2">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>${t("addPhoto")}</span>
    </button>` : "");
  const addBtn2 = document.getElementById("imgAddBtn2");
  if(addBtn2) addBtn2.addEventListener("click", ()=> imgFileInput.click());
  // Re-bind delete handlers against the freshly rendered indices so the
  // DOM and the selectedFiles array can never drift out of sync.
  imgUploadRow.querySelectorAll("[data-del]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = Number(btn.dataset.del);
      const removed = selectedFiles.splice(idx,1)[0];
      if(removed && removed.localUrl) URL.revokeObjectURL(removed.localUrl);
      renderImgThumbs();
      persistSellDraft();
    });
  });
}

async function uploadToCloudinary(file){
  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", UPLOAD_PRESET);

  // Guard against a hanging promise if the network stalls indefinitely.
  const controller = new AbortController();
  const timeoutId = setTimeout(()=> controller.abort(), 45000);

  let res;
  try{
    res = await fetch(CLOUDINARY_URL, { method:"POST", body:formData, signal:controller.signal });
  }catch(err){
    if(err.name === "AbortError"){
      throw new Error("Cloudinary upload timed out");
    }
    throw err;
  }finally{
    clearTimeout(timeoutId);
  }

  if(!res.ok){
    let message = "Cloudinary upload failed";
    try{
      const errBody = await res.json();
      if(errBody && errBody.error && errBody.error.message) message = errBody.error.message;
    }catch(_){ /* response wasn't JSON — keep default message */ }
    throw new Error(message);
  }
  const data = await res.json();
  if(!data || !data.secure_url) throw new Error("Cloudinary response missing secure_url");
  return data.secure_url;
}

sellForm.addEventListener("input", persistSellDraftDebounced);

sellForm.addEventListener("submit", async (e)=>{
  e.preventDefault();
  if(!currentUser){
    openModal(authModal);
    return;
  }
  const title = document.getElementById("fTitle").value.trim();
  const price = Number(document.getElementById("fPrice").value);
  const category = document.getElementById("fCategory").value;
  const description = document.getElementById("fDesc").value.trim();
  const location = document.getElementById("fLocation").value.trim();
  const phone = document.getElementById("fPhone").value.trim();

  if(!title || !price || !description || !location || !/^\d{10}$/.test(phone)){
    showToast(t("toastFillFields"));
    return;
  }
  if(selectedFiles.length===0){
    showToast(t("toastAddPhoto"));
    return;
  }

  sellSubmitBtn.disabled = true;
  sellSubmitBtn.textContent = t("posting");

  try{
    const uploadedUrls = [];
    for(let i=0;i<selectedFiles.length;i++){
      uploadProgress.textContent = `Uploading photo ${i+1} of ${selectedFiles.length}...`;
      const url = await uploadToCloudinary(selectedFiles[i].file);
      uploadedUrls.push(url);
    }
    uploadProgress.textContent = "";

    const newDocRef = await addDoc(collection(db, POSTS_COLLECTION), {
      title, price, description, location,
      phone: sanitizePhone(phone),
      category,
      images: uploadedUrls,
      ownerUid: currentUser.uid,
      ownerName: currentUser.displayName || "",
      createdAt: serverTimestamp()
    });

    const newPost = {
      id: newDocRef.id, title, price, description, location,
      phone: sanitizePhone(phone), category, images: uploadedUrls,
      ownerUid: currentUser.uid, ownerName: currentUser.displayName || "",
      _ts: Date.now()
    };
    allPosts = [newPost, ...allPosts];
    mergeIntoCache([newPost]);
    renderFeed(false);

    selectedFiles.forEach(f=>{ if(f.localUrl) URL.revokeObjectURL(f.localUrl); });
    selectedFiles = [];
    renderImgThumbs();
    clearSellDraft();

    showToast(t("toastPosted"));
    closeModal(sellModal);
    switchView("home");
  }catch(err){
    console.error(err);
    showToast(t("toastError"));
  }finally{
    sellSubmitBtn.disabled = false;
    sellSubmitBtn.textContent = t("postProduct");
    uploadProgress.textContent = "";
  }
});

async function renderProfileView(){
  const el = document.getElementById("profileView");
  if(!currentUser){
    el.innerHTML = `
      <div style="padding-top:calc(var(--header-h) + 16px); max-width:600px; margin:0 auto;">
        <div class="guest-card">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none" style="margin:0 auto 8px; color:var(--ink-faint);"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 20C5.5 16.5 8.4 14.5 12 14.5C15.6 14.5 18.5 16.5 19.5 20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <h3>${t("guestTitle")}</h3>
          <p>${t("guestSub")}</p>
          <button class="btn-primary-pill" id="profileSignInBtn">${t("signIn")}</button>
        </div>
      </div>`;
    document.getElementById("profileSignInBtn").addEventListener("click", ()=> openModal(authModal));
    return;
  }

  const photo = currentUser.photoURL;
  const initials = (currentUser.displayName || currentUser.email || "U").charAt(0).toUpperCase();
  el.innerHTML = `
    <div style="padding-top:calc(var(--header-h) + 16px); max-width:700px; margin:0 auto;">
      <div class="profile-header">
        ${photo ? `<img class="profile-avatar" src="${photo}" alt="avatar">` : `<div class="profile-avatar-fallback">${initials}</div>`}
        <div>
          <div class="profile-name">${escapeHtml(currentUser.displayName || "ReShop User")}</div>
          <div class="profile-email">${escapeHtml(currentUser.email || "")}</div>
          <button class="profile-signout" id="signOutBtn">${t("signOut")}</button>
        </div>
      </div>
      <div class="section-heading">${t("myProducts")}</div>
      <div id="myProductsList"><div class="skeleton" style="aspect-ratio:auto; height:90px; margin:0 14px 10px;"></div></div>
    </div>`;

  document.getElementById("signOutBtn").addEventListener("click", ()=>{
    openModal(signOutModal);
  });

  try{
    const myPosts = await fetchMyPosts(currentUser.uid);
    renderMyProducts(myPosts);
  }catch(e){
    console.error(e);
    document.getElementById("myProductsList").innerHTML = `<p style="padding:0 14px; color:var(--ink-soft); font-size:.85rem;">${t("toastError")}</p>`;
  }
}

function renderMyProducts(posts){
  const list = document.getElementById("myProductsList");
  if(!list) return;
  if(posts.length===0){
    list.innerHTML = `
      <div class="guest-card" style="margin:0 14px;">
        <h3 style="font-size:.95rem;">${t("noProducts")}</h3>
        <p style="font-size:.8rem;">${t("noProductsSub")}</p>
      </div>`;
    return;
  }
  list.innerHTML = posts.map(p=>`
    <div class="myproduct-card" data-id="${p.id}">
      <img src="${escapeHtml(p.images[0])}" alt="${escapeHtml(p.title)}">
      <div class="myproduct-info">
        <div class="myproduct-title">${escapeHtml(p.title)}</div>
        <div class="myproduct-price">${formatPrice(p.price)}</div>
        <div class="card-loc">${escapeHtml(p.location)}</div>
      </div>
      <button class="myproduct-del" data-del-id="${p.id}" aria-label="Delete">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  `).join("");
  list.querySelectorAll("[data-del-id]").forEach(btn=>{
    btn.addEventListener("click", ()=> handleDeleteProduct(btn.dataset.delId));
  });
}

async function handleDeleteProduct(id){
  if(!confirm(t("confirmDelete"))) return;
  try{
    await deleteDoc(doc(db, POSTS_COLLECTION, id));
    removeFromCache(id);
    allPosts = allPosts.filter(p=>p.id!==id);
    const cardEl = document.querySelector(`.myproduct-card[data-id="${id}"]`);
    if(cardEl) cardEl.remove();
    const feedCardEl = document.querySelector(`.card[data-id="${id}"]`);
    if(feedCardEl) feedCardEl.remove();
    showToast(t("toastDeleted"));
    const list = document.getElementById("myProductsList");
    if(list && !list.querySelector(".myproduct-card")){
      renderMyProducts([]);
    }
  }catch(e){
    console.error(e);
    showToast(t("toastError"));
  }
}

(async function boot(){
  const savedTheme = localStorage.getItem("reshop_theme") || "light";
  applyTheme(savedTheme);
  applyI18n();
  syncHeaderChromeVisibility();
  // Runs on every load (including the post-redirect reload) to catch the
  // credentials Google sends back after signInWithRedirect(), before the
  // rest of the UI settles in.
  await handleRedirectResult();
  // If a Sell draft survived a background reload (e.g. from a camera
  // capture), restore it and reopen the Sell modal automatically.
  await restoreSellDraftIfAny();
  initFeed();
})();

<script>
  const searchInput = document.getElementById('searchInput');
  const searchBtn = document.getElementById('searchClear');

  // SVG Icons
  const ICON_KEYBOARD_DOWN = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`;
  const ICON_CLEAR = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>`;

  // यूआई और आइकॉन्स अपडेट करने का फ़ंक्शन
  function updateSearchUI() {
    const isFocused = document.activeElement === searchInput;
    const hasText = searchInput.value.trim().length > 0;

    if (hasText) {
      // 1. टाइपिंग होने पर X दिखाएँ
      searchBtn.innerHTML = ICON_CLEAR;
      searchBtn.style.display = 'flex';
      searchBtn.dataset.mode = 'clear';
    } else if (isFocused) {
      // 2. खाली बॉक्स पर क्लिक/फोकस होने पर Down Arrow (Back) दिखाएँ
      searchBtn.innerHTML = ICON_KEYBOARD_DOWN;
      searchBtn.style.display = 'flex';
      searchBtn.dataset.mode = 'blur';
    } else {
      // 3. अनफोकस्ड और खाली होने पर बटन छिपाएँ
      searchBtn.style.display = 'none';
    }
  }

  // इनपुट पर टाइपिंग और फोकस इवेंट्स
  searchInput.addEventListener('focus', updateSearchUI);
  searchInput.addEventListener('input', updateSearchUI);
  searchInput.addEventListener('keyup', updateSearchUI);

  // बटन पर क्लिक/टैप लॉजिक (mousedown का उपयोग किया गया है ताकि फोकस न टूटे)
  searchBtn.addEventListener('mousedown', (e) => {
    e.preventDefault(); 
    const mode = searchBtn.dataset.mode;

    if (mode === 'clear') {
      // 1. इनपुट फ़ील्ड खाली करें
      searchInput.value = '';
      
      // 2. 'input' इवेंट ट्रिगर करें ताकि आपकी यूज़र/आइटम लिस्ट तुरंत रीसेट हो जाए और खाली न दिखे
      searchInput.dispatchEvent(new Event('input'));
      
      // 3. आइकॉन को तुरंत 'Back/Keyboard Down' में बदलें
      updateSearchUI();
      searchInput.focus();
    } else if (mode === 'blur') {
      // कीबोर्ड हटाएँ और बटन छुपाएँ
      searchInput.blur();
      updateSearchUI();
    }
  });

  // फोकस हटने पर रीसेट (कीबोर्ड बंद होने की स्थिति में)
  searchInput.addEventListener('blur', () => {
    setTimeout(updateSearchUI, 200);
  });
</script>
