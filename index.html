/* --------------------------------------------------------
   Camera-capture state preservation.
   Opening the native camera from a file input can cause some mobile
   browsers to reclaim memory and silently reload the page/tab once the
   user returns — which would normally wipe out whatever they'd already
   typed and any photos already added. To survive that, we continuously
   snapshot the Sell form (fields + photos, photos as data URLs so the
   actual File objects can be rebuilt) into sessionStorage, and restore
   it automatically on the next load if a draft is found.
   -------------------------------------------------------- */
function fileToDataURL(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function dataURLToFile(dataUrl, filename, mimeType){
  const parts = dataUrl.split(",");
  const mimeMatch = parts[0].match(/:(.*?);/);
  const mime = mimeType || (mimeMatch ? mimeMatch[1] : "image/jpeg");
  const bstr = atob(parts[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  while(n--){ u8arr[n] = bstr.charCodeAt(n); }
  return new File([u8arr], filename || "photo.jpg", { type: mime });
}
function debounce(fn, wait){
  let timer = null;
  return (...args)=>{
    clearTimeout(timer);
    timer = setTimeout(()=> fn(...args), wait);
  };
}

async function persistSellDraft(){
  if(!sellModal.classList.contains("open")) return;
  const draft = {
    modalOpen: true,
    title: document.getElementById("fTitle").value,
    price: document.getElementById("fPrice").value,
    category: document.getElementById("fCategory").value,
    description: document.getElementById("fDesc").value,
    location: document.getElementById("fLocation").value,
    phone: document.getElementById("fPhone").value,
    images: []
  };
  try{
    draft.images = await Promise.all(selectedFiles.map(async f=>({
      name: f.file.name || "photo.jpg",
      type: f.file.type || "image/jpeg",
      dataUrl: await fileToDataURL(f.file)
    })));
    sessionStorage.setItem(SELL_DRAFT_KEY, JSON.stringify(draft));
  }catch(e){
    // Likely a storage-quota issue with large camera photos — fall back to
    // preserving just the typed fields so nothing is lost outright.
    try{
      draft.images = [];
      sessionStorage.setItem(SELL_DRAFT_KEY, JSON.stringify(draft));
    }catch(_){ /* give up silently — best-effort only */ }
  }
}
const persistSellDraftDebounced = debounce(persistSellDraft, 400);

function clearSellDraft(){
  try{ sessionStorage.removeItem(SELL_DRAFT_KEY); }catch(e){ /* ignore */ }
}

async function restoreSellDraftIfAny(){
  let raw;
  try{ raw = sessionStorage.getItem(SELL_DRAFT_KEY); }catch(e){ return; }
  if(!raw) return;
  let draft;
  try{ draft = JSON.parse(raw); }catch(e){ clearSellDraft(); return; }
  if(!draft || !draft.modalOpen) return;

  selectedFiles = [];
  (draft.images || []).forEach(img=>{
    try{
      const file = dataURLToFile(img.dataUrl, img.name, img.type);
      const localUrl = URL.createObjectURL(file);
      selectedFiles.push({file, localUrl});
    }catch(e){ /* skip a corrupted entry, keep the rest */ }
  });

  openSellModal({preserveDraft:true});
  document.getElementById("fTitle").value = draft.title || "";
  document.getElementById("fPrice").value = draft.price || "";
  document.getElementById("fCategory").value = draft.category || "Home";
  document.getElementById("fDesc").value = draft.description || "";
  document.getElementById("fLocation").value = draft.location || "";
  document.getElementById("fPhone").value = draft.phone || "";
  renderImgThumbs();
  showToast(t("toastDraftRestored"));
}
document.addEventListener("visibilitychange", ()=>{

/* --------------------------------------------------------
   View-state preservation (WhatsApp / Call-and-back).
   Tapping the WhatsApp or Call button backgrounds the tab the exact
   same way a camera capture does (see above) — and can just as
   silently cause a background reload. Without this, the reload lands
   back on the plain homepage instead of the product the user was just
   messaging/calling about. Fix: snapshot which screen is open (Detail
   view + which product, or the Search screen + its query) the instant
   the tab is hidden, and put the user back on exactly that screen on
   the very next load — no home-screen bounce, no extra navigation. */
function persistViewState(){
  try{
    if(currentView === "detail" && currentDetailPostId){
      sessionStorage.setItem(VIEW_STATE_KEY, JSON.stringify({
        view:"detail", productId:currentDetailPostId, detailReturnView
      }));
    } else if(currentView === "search"){
      sessionStorage.setItem(VIEW_STATE_KEY, JSON.stringify({ view:"search", activeSearch }));
    } else if(currentView === "profile"){
      sessionStorage.setItem(VIEW_STATE_KEY, JSON.stringify({ view:"profile" }));
    } else {
      // Home (or anything else) needs no recovery — clear any stale
      // entry so a later, unrelated backgrounding doesn't reopen an
      // old product/search by mistake.
      sessionStorage.removeItem(VIEW_STATE_KEY);
    }
  }catch(e){ /* best-effort only */ }
}

/* Returns true if it actually restored something, so BOOT can skip the
   normal shared-product-link handling below (that one is for links
   opened by OTHER people and deliberately ignores products already
   "visited" on this device — this recovery must NOT be blocked by that
   same check, since of course the user has already "visited" the very
   product they were just messaging/calling about). */
async function restoreViewStateIfAny(){
  let raw;
  try{ raw = sessionStorage.getItem(VIEW_STATE_KEY); }catch(e){ return false; }
  if(!raw) return false;
  let state;
  try{ state = JSON.parse(raw); }catch(e){ return false; }
  if(!state || !state.view) return false;

  if(state.view === "detail" && state.productId){
    const post = await getPostByIdUniversal(state.productId);
    if(!post) return false;
    if(!allPosts.some(p=>p.id===post.id)) allPosts = [post, ...allPosts];
    openDetailView(post.id, state.detailReturnView === "search" ? "search" : "home");
    return true;
  }
  if(state.view === "search"){
    activeSearch = state.activeSearch || "";
    openSearchView();
    exploreSearchInput.value = activeSearch;
    updateExploreActionIcon();
    renderExploreGrid();
    return true;
  }
  if(state.view === "profile"){
    switchView("profile");
    return true;
  }
  return false;
}

/* ==========================================================
   AUTOMATIC IMAGE COMPRESSION (Canvas): shrinks MB-sized photos
   down to low-KB JPEGs before they ever touch selectedFiles /
   sessionStorage / Cloudinary — keeps the sessionStorage draft
   snapshot (which stores photos as base64 data URLs) far below
   its quota, and makes uploads noticeably faster on mobile data.
   ========================================================== */
function loadImageFromFile(file){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(img.src); resolve(img); };
    img.onerror = (err)=>{ URL.revokeObjectURL(img.src); reject(err); };
    img.src = URL.createObjectURL(file);
  });
}
function canvasToBlob(canvas, quality){
  return new Promise(resolve=> canvas.toBlob(blob=> resolve(blob), "image/jpeg", quality));
}
async function compressImageFile(file, opts){
  const maxDim = (opts && opts.maxDimension) || COMPRESS_MAX_DIMENSION;
  const targetBytes = (opts && opts.targetBytes) || COMPRESS_TARGET_BYTES;

  let img;
  try{
    img = await loadImageFromFile(file);
  }catch(e){
    return file; // couldn't decode as an image — fall back to the original
  }

  let { width, height } = img;
  if(width > maxDim || height > maxDim){
    if(width >= height){ height = Math.round(height * (maxDim / width)); width = maxDim; }
    else { width = Math.round(width * (maxDim / height)); height = maxDim; }
  }

  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0, width, height);

  // Step quality down until the JPEG is under the target size, or we hit a
  // sensible floor so the image doesn't turn to mush.
  let quality = 0.82;
  let blob = await canvasToBlob(canvas, quality);
  while(blob && blob.size > targetBytes && quality > 0.35){
    quality -= 0.12;
    blob = await canvasToBlob(canvas, quality);
  }

  if(!blob || blob.size >= file.size){
    return file; // compression didn't actually help — keep the original
  }
  const newName = (file.name || "photo").replace(/\.[^.]+$/, "") + ".jpg";
  return new File([blob], newName, { type: "image/jpeg" });
}

imgAddBtn.addEventListener("click", ()=> imgFileInput.click());
imgFileInput.addEventListener("change", async (e)=>{
  const files = Array.from(e.target.files || []);
  if(files.length === 0) return;

  // Validate each picked file before it ever touches selectedFiles, so the
  // array stays a true reflection of what's actually valid and previewable.
  const validFiles = [];
  let hadInvalidType = false;
  let hadTooLarge = false;
  files.forEach(file=>{
    if(!file.type || !file.type.startsWith("image/")){
      hadInvalidType = true;
      return;
    }
    if(file.size > MAX_PHOTO_BYTES){
      hadTooLarge = true;
      return;
    }
    validFiles.push(file);
  });
  if(hadInvalidType) showToast(t("toastInvalidPhoto"));
  if(hadTooLarge) showToast(t("toastPhotoTooLarge"));

  const room = Math.max(0, MAX_PHOTOS - selectedFiles.length);
  if(validFiles.length > room){
    showToast(t("toastMaxPhotos"));
  }
  imgFileInput.value = ""; // allow re-selecting the same file later, right away

  const toAdd = validFiles.slice(0, room);
  for(const original of toAdd){
    const compressed = await compressImageFile(original);
    const localUrl = URL.createObjectURL(compressed);
    selectedFiles.push({file: compressed, localUrl});
    renderImgThumbs(); // update the grid as each photo finishes, not all at once
  }
  persistSellDraft(); // snapshot immediately — a camera capture may background the tab next
});

function renderImgThumbs(){
  const thumbs = selectedFiles.map((f, idx)=>`
    <div class="img-thumb" data-idx="${idx}">
      <img src="${f.localUrl}" alt="preview ${idx+1}">
      <button type="button" class="img-del" data-del="${idx}" aria-label="Remove photo">✕</button>
    </div>
  `).join("");
  imgUploadRow.innerHTML = thumbs + (selectedFiles.length < MAX_PHOTOS ? `
    <button type="button" class="img-add-btn" id="imgAddBtn2">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>

    </button>` : "");
  const addBtn2 = document.getElementById("imgAddBtn2");
  if(addBtn2) addBtn2.addEventListener("click", ()=> imgFileInput.click());
  // Re-bind delete handlers against the freshly rendered indices so the
  // DOM and the selectedFiles array can never drift out of sync.
  imgUploadRow.querySelectorAll("[data-del]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = Number(btn.dataset.del);
      const removed = selectedFiles.splice(idx,1)[0];
      if(removed && removed.localUrl) URL.revokeObjectURL(removed.localUrl);
      renderImgThumbs();
      persistSellDraft();
    });
  });
}

async function uploadToCloudinary(file){
  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", UPLOAD_PRESET);

  // Guard against a hanging promise if the network stalls indefinitely.
  const controller = new AbortController();
  const timeoutId = setTimeout(()=> controller.abort(), 45000);

  let res;
  try{
    res = await fetch(CLOUDINARY_URL, { method:"POST", body:formData, signal:controller.signal });
  }catch(err){
    if(err.name === "AbortError"){
      throw new Error("Cloudinary upload timed out");
    }
    throw err;
  }finally{
    clearTimeout(timeoutId);
  }

  if(!res.ok){
    let message = "Cloudinary upload failed";
    try{
      const errBody = await res.json();
      if(errBody && errBody.error && errBody.error.message) message = errBody.error.message;
    }catch(_){ /* response wasn't JSON — keep default message */ }
    throw new Error(message);
  }
  const data = await res.json();
  if(!data || !data.secure_url) throw new Error("Cloudinary response missing secure_url");
  return data.secure_url;
}

    await deleteDoc(doc(db, POSTS_COLLECTION, id));

    const cardEl = document.querySelector(`.myproduct-card[data-id="${id}"]`);
    if(cardEl) cardEl.remove();
    const feedCardEl = document.querySelector(`.card[data-id="${id}"]`);

      renderMyProducts([]);
    }
  }catch(e){
    console.error(e);
    showToast(t("toastError"));
  }
}

/* ==========================================================
   SPLASH SCREEN TIMING
   ========================================================== */
/* Opening the native camera from the Sell form's file input can cause
   some mobile browsers to reclaim memory and silently reload the tab
   once the user returns from the camera app — restoreSellDraftIfAny()
   below already recovers the typed fields + photos from sessionStorage
   when that happens, but showing the full 3-second splash on top of
   that recovery still LOOKS exactly like the whole app restarted from
   scratch. So: if a Sell draft is sitting in sessionStorage the instant
   this script runs, this load is almost certainly that camera bounce-
   back rather than a genuine fresh open — skip the splash's branding
   delay entirely so control returns to the Sell screen (photo already
   in place) as close to instantly as the reload itself allows, with no
   "the app just restarted" moment at all. */
/* Opening the native camera from the Sell form's file input (or opening
   WhatsApp/the phone dialer from a product's contact buttons) can cause
   some mobile browsers to reclaim memory and silently reload the tab
   once the user returns — restoreSellDraftIfAny()/restoreViewStateIfAny()
   below already recover the Sell form or the exact screen (product
   detail / search) from sessionStorage when that happens, but showing
   the full 3-second splash on top of that recovery still LOOKS exactly
   like the whole app restarted from scratch. So: if either kind of
   recoverable state is sitting in sessionStorage the instant this
   script runs, this load is almost certainly one of those bounce-backs
   rather than a genuine fresh open — skip the splash's branding delay
   entirely so control returns to the same screen as close to instantly
   as the reload itself allows, with no "the app just restarted" moment
   at all. */
let hadRecoverableStateOnBoot = false;
try{
  hadRecoverableStateOnBoot = !!sessionStorage.getItem(SELL_DRAFT_KEY) || !!sessionStorage.getItem(VIEW_STATE_KEY);
}catch(e){ /* ignore */ }

window.addEventListener("load", ()=>{
  const splash = document.getElementById("splash");
  if(hadRecoverableStateOnBoot){
    splash.remove();
    return;
  }
  setTimeout(()=>{
    splash.classList.add("exit");
    setTimeout(()=> splash.remove(), 650);
  }, 3000);
});

/* ==========================================================
   BOOT
   ========================================================== */
(async function boot(){
  const savedTheme = localStorage.getItem("reshop_theme") || "light";
  applyTheme(savedTheme);
  applyI18n();
  syncHeaderChromeVisibility();
  // If a Sell draft or a product/search screen survived a background
  // reload (camera capture, or WhatsApp/Call-and-back), restore it right
  // away — this runs before the Google-redirect check below since it's
  // the more time-sensitive of the two (see the splash-skip note above)
  // and the flows never overlap in practice.
  await restoreSellDraftIfAny();
  const restoredView = await restoreViewStateIfAny();
  // Runs on every load (including the post-redirect reload) to catch the
  // credentials Google sends back after signInWithRedirect(), before the
  // rest of the UI settles in.
  await handleRedirectResult();
  initFeed();
  // Universal product share link: if this load came from a ?prod=<id>
  // link, open that product's detail view directly — works for any
  // user/device, independent of whether the feed has loaded yet. Skipped
  // when restoreViewStateIfAny() already put the user back on their
  // product above — that recovery must win over the shared-link
  // "already visited, don't reopen" check, not get overridden by it.
  if(!restoredView) handleSharedProductLink();
})();
</script>
</body>
</html>
